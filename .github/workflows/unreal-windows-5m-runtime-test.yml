name: Honour War Unreal 5.8 Five-Minute Runtime Bug Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: honour-war-unreal-windows-5m-runtime-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  runtime-test:
    runs-on: [self-hosted, windows, unreal-engine-5.8]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Static checks are not gameplay evidence
        shell: pwsh
        run: Write-Host "STATIC_VALIDATION_IS_NOT_RUNTIME_TEST=TRUE"

      - name: Validate runtime harness contracts
        shell: pwsh
        run: |
          python tools/honour_war_1h_soak_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/full_game_test_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preflight Unreal Engine 5.8
        shell: pwsh
        env:
          UNREAL_ENGINE_ROOT: C:\Program Files\Epic Games\UE_5.8
        run: |
          $editor = Join-Path $env:UNREAL_ENGINE_ROOT "Engine\Binaries\Win64\UnrealEditor.exe"
          if (!(Test-Path $editor)) { throw "Unreal Engine 5.8 editor was not found at $editor" }
          & $editor -Version

      - name: Build and package real Windows EXE
        shell: pwsh
        env:
          UNREAL_ENGINE_ROOT: C:\Program Files\Epic Games\UE_5.8
        run: powershell -ExecutionPolicy Bypass -File Build/Build-HonourWar.ps1 -Package

      - name: Verify real EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Build\Windows\HonourWar -Recurse -Filter HonourWar.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw "HonourWar.exe was not produced." }
          if ($exe.Length -lt 1000000) { throw "HonourWar.exe is unexpectedly small: $($exe.Length) bytes." }
          Write-Host "REAL_EXE_PASS: $($exe.FullName) size=$($exe.Length)"

      - name: REAL RUNTIME TEST — five minutes
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File Build/Run-HonourWar-1h-Soak.ps1 -TimeoutSeconds 300

      - name: Upload five-minute soak report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-5m-soak-report
          path: Build/HonourWar-1h-soak-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload five-minute runtime log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-5m-runtime-log
          path: Build/HonourWar-1h-runtime-log.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload five-minute classified errors
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-5m-soak-errors
          path: Build/HonourWar-1h-soak-errors.txt
          if-no-files-found: warn
          retention-days: 30
