name: Honour War Private GLB Preview QA

on:
  push:
    paths:
      - ".github/workflows/private-glb-preview-qa.yml"
      - "tools/validate_generated_glbs.py"
      - "tools/blender/**"
      - "tools/visual_rag/**"
      - "assets/3d/visual_rag/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-private-glb-preview
  cancel-in-progress: false

jobs:
  private-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify checkout matches triggering revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Run Visual RAG first
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_rag/honour_war_visual_rag.py
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.md

      - name: Preflight GLB validator parser contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_generated_glbs.py
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, ".")
          from tools.validate_generated_glbs import hero_class_and_tier, validate_hero_path_parser

          cases = {
              "Warrior": Path("assets/3d/generated/characters/Warrior/Advanced.glb"),
              "Mage": Path("assets/3d/generated/characters/Mage/Foundation.glb"),
              "Archer": Path("assets/3d/generated/characters/Archer/Mastery.glb"),
              "Thief": Path("assets/3d/generated/characters/Thief/Transcendence.glb"),
              "Acolyte": Path("assets/3d/generated/characters/Acolyte/Specialization.glb"),
              "Merchant": Path("assets/3d/generated/characters/Merchant/Advanced.glb"),
          }
          validate_hero_path_parser()
          for expected, path in cases.items():
              actual, _tier = hero_class_and_tier(path)
              if actual != expected:
                  raise SystemExit(f"GLB validator parser regression: {path} -> {actual!r}, expected {expected!r}")
          print("PASS: hero GLB path parser resolves characters/<class>/<tier>.glb correctly")
          PY

      - name: Download official Blender 4.2.23
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz
          rm -rf /opt/blender /tmp/blender-site
          mkdir -p /opt/blender /tmp/blender-site
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version

      - name: Install Blender Python dependency
        shell: bash
        run: |
          set -euo pipefail
          /opt/blender/blender --background --python-expr 'import ensurepip,sys,subprocess; ensurepip.bootstrap(); subprocess.check_call([sys.executable,"-m","pip","install","--no-cache-dir","--target=/tmp/blender-site","numpy"])'

      - name: Generate fresh hero and pet GLBs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          mkdir -p assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/run_visual_max_assets.py

      - name: Generate fresh monster GLBs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/monsters
          mkdir -p assets/3d/generated/monsters
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/honour_war_monster_assets.py

      - name: Apply embedded PBR texture pass
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/enhance_generated_glbs.py

      - name: Validate generated GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generated_glbs.py

      - name: Build private QA package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/private-glb-preview
          cp assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json qa/private-glb-preview/
          cp assets/3d/visual_rag/LATEST_VISUAL_BRIEF.md qa/private-glb-preview/
          cp assets/3d/generated/GENERATED_ASSET_MANIFEST.json qa/private-glb-preview/ 2>/dev/null || true
          find assets/3d/generated -type f -name '*.glb' -print0 | sort -z | xargs -0 sha256sum > qa/private-glb-preview/GLB_SHA256.txt
          find assets/3d/generated -type f -name '*.glb' | sort > qa/private-glb-preview/GLB_FILE_LIST.txt
          cat > qa/private-glb-preview/README.md <<'EOF'
          # Honour War private GLB preview

          This package is a staging/QA build only.

          Pipeline:
          Visual RAG -> Blender 4.2 -> PBR texture pass -> GLB -> validation

          No generated GLB from this workflow is committed back to the repository.
          Review this package before publishing the asset build.
          EOF
          cp -R assets/3d/generated qa/private-glb-preview/generated

      - name: Upload private preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-private-glb-preview
          path: qa/private-glb-preview
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Staging-only guard
        shell: bash
        run: |
          set -euo pipefail
          echo "PRIVATE PREVIEW COMPLETE: generated assets remain uncommitted."
