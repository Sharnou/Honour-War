name: Game3D syntax guard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify fallback match syntax is already valid
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('scripts/Game3D.gd').read_text(encoding='utf-8')
          if '\t\telse:\n\t\t\tvar wolf:MeshInstance3D' in s:
              raise SystemExit('Invalid pet match fallback syntax is still present')
          if '\t\t_:\n\t\t\tvar wolf:MeshInstance3D' not in s:
              raise SystemExit('Expected Game3D pet match fallback marker was not found')
          print('PASS: Game3D match fallback syntax guard')
          PY
