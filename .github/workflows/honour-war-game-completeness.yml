name: Honour War Game Completeness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  contract:
    name: Godot 4.7.2 end-to-end completeness contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify checkout matches triggering commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_BINARY}.zip"
          unzip -q godot.zip
          chmod +x "${GODOT_BINARY}"

      - name: Import project and build Godot global class cache
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --editor --path . --quit 2>&1 | tee godot-editor-import.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene' godot-editor-import.log; then
            exit 1
          fi

      - name: Validate game completion contract
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/game_completion_contract_test.gd 2>&1 | tee game-completeness.log

      - name: Validate online authority contract
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/online_authority_test.gd 2>&1 | tee online-authority.log

      - name: Validate dedicated authoritative server
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/online_server_smoke_test.gd 2>&1 | tee online-server.log

      - name: Validate account and persistent player services
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/online_persistence_test.gd 2>&1 | tee online-persistence.log

      - name: Validate four-player party service
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/party_service_test.gd 2>&1 | tee party-service.log

      - name: Validate authoritative world state
        shell: bash
        run: |
          set -euo pipefail
          ./${GODOT_BINARY} --headless --path . --script res://tests/online_world_state_test.gd 2>&1 | tee online-world-state.log

      - name: Upload completeness logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-game-completeness-logs
          path: |
            godot-editor-import.log
            game-completeness.log
            online-authority.log
            online-server.log
            online-persistence.log
            party-service.log
            online-world-state.log
          if-no-files-found: error
          retention-days: 14
