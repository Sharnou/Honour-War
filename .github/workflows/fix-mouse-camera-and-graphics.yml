name: Fix mouse camera and monster presentation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: honour-war-main-writer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Apply idempotent mouse movement repair
        shell: python
        run: |
          from pathlib import Path

          mouse = Path('scripts/MouseMMOController.gd')
          text = mouse.read_text(encoding='utf-8')

          replacements = [
              (
                  '''func _ready()->void:\n\tgame=get_parent()\n\tlegacy=game.get_node_or_null("LegacyGame") as Node2D\n\tcamera=game.get_node_or_null("Camera3D") as Camera3D\n\t_build_cursor_marker()''',
                  '''func _ready()->void:\n\tgame=get_parent()\n\tlegacy=game.get_node_or_null("LegacyGame") as Node2D\n\tcamera=game.get_node_or_null("Camera3D") as Camera3D\n\tcall_deferred("_build_cursor_marker")''',
                  'cursor marker initialization',
              ),
              (
                  '''\tfor item in get_tree().get_nodes_in_group("warp_gate"):\n\t\tvar gate:Node=item as Node\n\t\tif gate==null or not gate.visible: continue\n\t\tvar gate_3d:Node3D=gate as Node3D\n\t\tif gate_3d==null: continue''',
                  '''\tfor item in get_tree().get_nodes_in_group("warp_gate"):\n\t\tvar gate:Node3D=item as Node3D\n\t\tif gate==null or not gate.is_visible_in_tree(): continue\n\t\tvar gate_3d:Node3D=gate''',
                  'warp-gate picking',
              ),
              (
                  '''\t\tif distance>7.0:\n\t\t\tvar step:float=min(distance,260.0*delta)\n\t\t\tvar direction:Vector2=hero_pos.direction_to(target_2d)\n\t\t\tvar map_data:Dictionary=TeleportSystem.MAPS.get(int(hero.get("map_id",0)),{})\n\t\t\tvar min_x:float=ORIGIN_X\n\t\t\tvar min_y:float=ORIGIN_Y\n\t\t\tvar max_x:float=ORIGIN_X+float(map_data.get("width",1200))-1.0\n\t\t\tvar max_y:float=ORIGIN_Y+float(map_data.get("height",700))-1.0\n\t\t\thero["pos_x"]=clamp(float(hero["pos_x"])+direction.x*step,min_x,max_x)\n\t\t\thero["pos_y"]=clamp(float(hero["pos_y"])+direction.y*step,min_y,max_y)\n\t\telse: has_move_target=false''',
                  '''\t\tif distance>7.0:\n\t\t\tvar step:float=min(distance,320.0*delta)\n\t\t\tvar direction:Vector2=hero_pos.direction_to(target_2d)\n\t\t\tvar map_data:Dictionary=TeleportSystem.MAPS.get(int(hero.get("map_id",0)),{})\n\t\t\tvar min_x:float=ORIGIN_X\n\t\t\tvar min_y:float=ORIGIN_Y\n\t\t\tvar max_x:float=ORIGIN_X+float(map_data.get("width",1200))-1.0\n\t\t\tvar max_y:float=ORIGIN_Y+float(map_data.get("height",700))-1.0\n\t\t\tvar next_x:float=clamp(float(hero["pos_x"])+direction.x*step,min_x,max_x)\n\t\t\tvar next_y:float=clamp(float(hero["pos_y"])+direction.y*step,min_y,max_y)\n\t\t\thero["pos_x"]=next_x\n\t\t\thero["pos_y"]=next_y\n\t\telse:\n\t\t\thero["pos_x"]=target_2d.x\n\t\t\thero["pos_y"]=target_2d.y\n\t\t\thas_move_target=false''',
                  'smooth ground movement',
              ),
              (
                  '''\tvar world_point:Vector3=_screen_to_ground(screen_position)\n\tif world_point==Vector3.INF: return\n\tattack_target={}\n\tmouse_target=world_point\n\thas_move_target=true''',
                  '''\tvar world_point:Vector3=_screen_to_ground(screen_position)\n\tif world_point==Vector3.INF: return\n\tattack_target={}\n\tmouse_target=world_point\n\thas_move_target=true\n\tattack_timer=0.0''',
                  'ground-click attack timer reset',
              ),
          ]

          changed = False
          for old, new, label in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True
                  print(f'Applied {label}.')
              elif new in text:
                  print(f'{label}: already present.')
              else:
                  raise SystemExit(f'Unsupported MouseMMOController state: {label}')

          required = [
              'call_deferred("_build_cursor_marker")',
              'var gate:Node3D=item as Node3D',
              'gate.is_visible_in_tree()',
              'min(distance,320.0*delta)',
              'attack_timer=0.0',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('MouseMMOController repair verification failed: ' + ', '.join(missing))

          if changed:
              mouse.write_text(text, encoding='utf-8')
              print('MouseMMOController updated.')
          else:
              print('MouseMMOController already matches the repaired state; no changes required.')

      - name: Verify camera ownership and combat animation state
        shell: python
        run: |
          from pathlib import Path
          game = Path('scripts/Game3D.gd').read_text(encoding='utf-8')
          anim = Path('scripts/CombatAnimationController.gd').read_text(encoding='utf-8')
          if 'func _update_camera(' not in game:
              raise SystemExit('Game3D camera update function is missing')
          if 'camera.look_at(' not in game:
              raise SystemExit('Game3D camera orientation update is missing')
          if 'hero.scale=Vector3.ONE' not in anim or 'pet.scale=Vector3.ONE' not in anim:
              raise SystemExit('Combat animation scale state contract is missing')
          if 'position:y' in anim and 'func _make_walk' in anim:
              raise SystemExit('Combat walk animation still targets legacy position:y tracks')
          print('Camera and combat animation integrity: PASS')

      - name: Commit repair when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Honour War Bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/MouseMMOController.gd
          if git diff --cached --quiet; then
            echo "No repair commit required."
            exit 0
          fi
          git commit -m "Repair idempotent mouse movement behavior"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "Failed to push mouse repair after 5 attempts."
          exit 1
