name: Honour War Neural4D HD Asset Generation

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Queue index to start at (0-based)"
        required: false
        default: "0"
      limit:
        description: "Number of assets to generate; 0 means all remaining"
        required: false
        default: "6"

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  generate:
    name: Generate FBX/OBJ HD assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v7

      - name: Run Neural4D batch generation
        env:
          NEURAL4D_API_KEY: ${{ secrets.NEURAL4D_API_KEY }}
        run: |
          test -n "$NEURAL4D_API_KEY"
          python3 tools/neural4d_batch_generate.py             --start "${{ inputs.start }}"             --limit "${{ inputs.limit }}"

      - name: Reject unexpected runtime interchange files
        run: |
          if find assets/3d/neural4d/incoming -type f             ! -name '*.fbx' ! -name '*.obj' | grep -q .; then
            echo "FAIL: unexpected generated file format detected"
            find assets/3d/neural4d/incoming -type f
            exit 1
          fi
          find assets/3d/neural4d/incoming -type f -print

      - name: Upload generated HD source assets
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-neural4d-hd-assets-${{ inputs.start }}-${{ inputs.limit }}
          path: assets/3d/neural4d/incoming/
          if-no-files-found: error
          retention-days: 14
