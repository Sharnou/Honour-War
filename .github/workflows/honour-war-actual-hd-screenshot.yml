name: Honour War Actual HD 3D Screenshot QA

on:
  push:
    branches: [main]
    paths:
      - "Main3D.tscn"
      - "scripts/**"
      - "assets/3d/**"
      - "Screenshot/**"
      - "tools/capture_real_game_screenshot.gd"
      - "tools/visual_frame_quality_qa.py"
      - "tools/validate_visual_reference_source.py"
      - ".github/workflows/honour-war-actual-hd-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-actual-hd-screenshot-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  actual-game-screenshot:
    name: Capture actual Honour War HD 3D frame
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Install Godot 4.7.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile godot.zip
          if ((Get-Item godot.zip).Length -lt 70000000) { throw "Godot archive unexpectedly small" }
          Expand-Archive -Path godot.zip -DestinationPath godot -Force
          Copy-Item "godot/Godot_v4.7.2-stable_win64.exe" "godot.exe"

      - name: Import project resources and global classes
        shell: pwsh
        run: |
          .\godot.exe --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | Tee-Object godot-import.log
          if ($LASTEXITCODE -ne 0) { throw "Godot project import/parse failed" }

      - name: Validate direct Screenshot visual source
        run: |
          python3 tools/validate_visual_reference_source.py

      - name: Capture actual game frame
        run: |
          mkdir -p visual-captures
          .\godot.exe --path . --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --resolution 1920x1080 --script res://tools/capture_real_game_screenshot.gd 2>&1 | Tee-Object actual-hd-screenshot.log
          if ($LASTEXITCODE -ne 0) { throw "Actual Forward+ screenshot capture failed" }
          if (-not (Test-Path "visual-captures/honour-war-real-game.png")) { throw "Actual game screenshot missing" }

      - name: Validate actual frame dimensions and visual quality
        run: |
          python3 tools/visual_frame_quality_qa.py

      - name: Upload actual game screenshot
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-actual-hd-3d-screenshot
          path: |
            visual-captures/honour-war-real-game.png
            actual-hd-screenshot.log
          if-no-files-found: error
          retention-days: 14
