name: Honour War Actual HD 3D Screenshot QA

on:
  push:
    branches: [main]
    paths:
      - "Main3D.tscn"
      - "scripts/**"
      - "assets/3d/**"
      - "Screenshot/**"
      - "tools/capture_real_game_screenshot.gd"
      - "tools/visual_frame_quality_qa.py"
      - "tools/validate_visual_reference_source.py"
      - ".github/workflows/honour-war-actual-hd-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-actual-hd-screenshot-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  actual-game-screenshot:
    name: Capture actual Honour War HD 3D frame
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip xvfb
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 20 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_BINARY}.zip"
          test -s godot.zip
          test "$(stat -c%s godot.zip)" -ge 70000000
          unzip -q godot.zip
          chmod +x "${GODOT_BINARY}"

      - name: Validate direct Screenshot visual source
        run: |
          python3 tools/validate_visual_reference_source.py

      - name: Capture actual game frame
        run: |
          mkdir -p visual-captures
          timeout 60s xvfb-run -a -s "-screen 0 1920x1080x24" ./"${GODOT_BINARY}" \
            --path . \
            --display-driver x11 \
            --audio-driver Dummy \
            --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --resolution 1920x1080 \
            --script res://tools/capture_real_game_screenshot.gd \
            2>&1 | tee actual-hd-screenshot.log
          test -s visual-captures/honour-war-real-game.png

      - name: Validate actual frame dimensions and visual quality
        run: |
          python3 tools/visual_frame_quality_qa.py

      - name: Upload actual game screenshot
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-actual-hd-3d-screenshot
          path: |
            visual-captures/honour-war-real-game.png
            actual-hd-screenshot.log
          if-no-files-found: error
          retention-days: 14
