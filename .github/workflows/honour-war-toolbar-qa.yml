name: Honour War Toolbar QA

on:
  push:
    paths:
      - "scripts/HWIconButton.gd"
      - "scripts/HWPolishedInterfaceV2.gd"
      - "scripts/HWVitalsStartupNormalizer.gd"
      - "tools/validate_toolbar.py"
      - ".github/workflows/honour-war-toolbar-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolbar-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"
      - name: Run toolbar static QA
        shell: bash
        run: python3 tools/validate_toolbar.py
      - name: Report
        run: echo "Toolbar icon/mode/vitals static QA completed. Local Godot click-test remains required for actual Windows rendering/input verification."
