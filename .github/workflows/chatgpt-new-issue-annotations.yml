name: CHATGPT New Issue Annotations

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing issue number to annotate"
        required: true
        type: number

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  annotate-new-issue:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish one-time new issue annotation for ChatGPT
        uses: actions/github-script@v8
        env:
          ANNOTATION_ISSUE_TITLE: CHATGPT Annotations — Honour War CI Failures
          ANNOTATION_ISSUE_NUMBER: "7"
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const channelNumber = Number(process.env.ANNOTATION_ISSUE_NUMBER);

            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = Number(context.payload.inputs?.issue_number);
            } else {
              issueNumber = context.payload.issue?.number;
            }

            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('A valid issue number is required.');
              return;
            }

            if (issueNumber === channelNumber) {
              core.info(`Skipping annotation channel issue #${channelNumber} itself.`);
              return;
            }

            const issueResponse = await github.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber
            });
            const issue = issueResponse.data;

            const actor = issue.user?.login ?? 'unknown';
            const labels = (issue.labels || [])
              .map(label => typeof label === 'string' ? label : label.name)
              .filter(Boolean);
            const body = String(issue.body ?? '').replace(/\r/g, '');
            const compact = (text, max = 2000) =>
              text.length <= max ? text : text.slice(0, max) + '\n[TRUNCATED]';

            const annotation = [
              '## CHATGPT ANNOTATION — HONOUR WAR NEW ISSUE',
              '',
              `**Issue:** [#${issue.number} — ${issue.title}](${issue.html_url})`,
              `**Opened by:** @${actor}`,
              `**Repository:** ${issue.repository?.full_name ?? `${owner}/${repo}`}`,
              `**Created:** ${issue.created_at}`,
              `**Labels:** ${labels.length ? labels.map(label => `\`${label}\``).join(', ') : 'None'}`,
              '',
              '### Issue body',
              '',
              compact(body || '_No issue body provided._'),
              '',
              '### ChatGPT handling rule',
              '',
              'Treat this annotation as a one-time project notification for the newly opened or manually selected issue. Inspect the current repository state and related workflows before changing code; keep the issue history auditable and repair root causes rather than bypassing validation.',
              '',
              `<!-- CHATGPT_NEW_ISSUE_ID:${issue.id} -->`
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number: channelNumber,
                per_page: 100
              }
            );

            const marker = `<!-- CHATGPT_NEW_ISSUE_ID:${issue.id} -->`;
            if (comments.some(comment => comment.body && comment.body.includes(marker))) {
              core.info(`Issue #${issue.number} is already annotated in issue #${channelNumber}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: channelNumber,
              body: annotation
            });

            core.info(`Published one-time ChatGPT new-issue annotation for #${issue.number} to issue #${channelNumber}.`);
