name: Honour War Final GLB Asset Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/final-glb-asset-build.yml"
      - "tools/blender/final_glb_build_trigger.txt"
      - "tools/blender/honour_war_visual_max_assets.py"
      - "tools/blender/run_visual_max_assets.py"
      - "tools/blender/honour_war_monster_assets.py"
      - "tools/blender/enhance_generated_glbs.py"
      - "tools/auto_repair_generated_glbs.py"
      - "tools/validate_camera_controls.py"
      - "tools/visual_rag/**"
      - "tools/validate_generated_glbs.py"
      - "project.godot"
      - "shaders/ToonShader.gdshader"
      - "scripts/HWVisualMaxDirectorFixed.gd"
      - "scripts/HWToonMaterialDirector.gd"
      - "scripts/HWIsometricCamera.gd"
      - "scripts/MovementStabilityFix.gd"
      - "scripts/EnvironmentCycle.gd"
      - "Main3D.tscn"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: honour-war-final-glb-${{ github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build-final-glb-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"

      - name: Validate Final GLB workflow contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflows = Path('.github/workflows')
          final = workflows / 'final-glb-asset-build.yml'
          repair = Path('tools/auto_repair_generated_glbs.py')
          camera_qa = Path('tools/validate_camera_controls.py')
          text = final.read_text(encoding='utf-8')
          repair_text = repair.read_text(encoding='utf-8')
          camera_text = camera_qa.read_text(encoding='utf-8')

          github_ref_expr = '$' + '{{ github.ref }}'
          github_sha_expr = '$' + '{{ github.sha }}'

          required = (
              'group: honour-war-final-glb-' + github_ref_expr,
              'cancel-in-progress: false',
              'queue: max',
              'uses: actions/checkout@v7',
              'ref: ' + github_sha_expr,
              'test "${actual}" = "${expected}"',
              '--retry 10 --retry-all-errors',
              'tar -tJf /tmp/blender.tar.xz',
              'test "${count}" -eq 53',
              'git rebase origin/main',
              'for attempt in 1 2 3 4 5',
              'tools/auto_repair_generated_glbs.py',
              'tools/validate_camera_controls.py',
              'BLENDER_EXECUTABLE',
              'PYTHONPATH: /tmp/blender-site',
              'hero_class_and_tier',
              'project.godot',
              '--repair-attempts 3',
              '--repair-timeout 900',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Missing Final GLB contract markers: ' + ', '.join(repr(x) for x in missing))

          repair_required = (
              'def check_parser_contract(',
              'def check_camera_contract(',
              'diagnose_camera_sources(',
              'post-repair semantic/PBR validation',
              'AUTO-REPAIR: PASS',
              '--fix',
              '--repair-attempts',
              '--repair-timeout',
              'timeout_seconds=',
              'no gate bypass',
          )
          repair_missing = [item for item in repair_required if item not in repair_text]
          if repair_missing:
              raise SystemExit('Missing hardened self-healing GLB repair markers: ' + ', '.join(repr(x) for x in repair_missing))

          camera_required = (
              'camera_rotate_left=',
              'camera_rotate_right=',
              'MOUSE_BUTTON_WHEEL_UP',
              'MOUSE_BUTTON_WHEEL_DOWN',
              'rotation_step_degrees:float = 90.0',
              'camera_distance=lerp(',
              'camera_yaw=rad_to_deg(lerp_angle',
          )
          camera_missing = [item for item in camera_required if item not in camera_text]
          if camera_missing:
              raise SystemExit('Missing camera-control QA markers: ' + ', '.join(repr(x) for x in camera_missing))

          for path in sorted(workflows.glob('*.yml')):
              if path == final:
                  continue
              other = path.read_text(encoding='utf-8')
              if ('assets/3d/generated' in other and 'schedule:' in other and 'contents: write' in other and 'git add assets/3d/generated' in other):
                  raise SystemExit(f'{path} is another scheduled writable generated-asset pipeline; Final GLB must remain the sole scheduled generated-asset writer')

          print('PASS: Final GLB workflow contract, hardened self-healing gate, parser guard, camera-control QA, and single-writer policy are intact.')
          PY

      - name: Preflight Blender, GLB, and camera QA Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/visual_rag/honour_war_visual_rag.py \
            tools/blender/honour_war_visual_max_assets.py \
            tools/blender/run_visual_max_assets.py \
            tools/blender/honour_war_monster_assets.py \
            tools/blender/enhance_generated_glbs.py \
            tools/auto_repair_generated_glbs.py \
            tools/validate_camera_controls.py \
            tools/validate_generated_glbs.py
          echo "GLB pipeline and camera QA Python syntax preflight: PASS"

      - name: Validate smooth zoom and 90-degree camera controls
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_camera_controls.py

      - name: Run Visual RAG first
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_rag/honour_war_visual_rag.py
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.md
          echo "Visual RAG completed before Blender asset generation."

      - name: Download official Blender 4.2.23
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 10 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 1200 \
            -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz
          test -s /tmp/blender.tar.xz
          tar -tJf /tmp/blender.tar.xz >/dev/null
          rm -rf /opt/blender /tmp/blender-site /tmp/blender-config
          mkdir -p /opt/blender /tmp/blender-site /tmp/blender-config
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --version

      - name: Install or verify Blender Python dependency for GLTF exporter
        shell: bash
        run: |
          set -euo pipefail
          if PYTHONPATH=/tmp/blender-site BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --background --python-expr 'import numpy; print("Bundled Blender numpy:", numpy.__version__)'; then
            echo "Using Blender bundled numpy."
          else
            installed=0
            for attempt in 1 2 3 4 5; do
              echo "Blender numpy install attempt ${attempt}"
              if BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --background --python-expr 'import ensurepip,sys,subprocess; ensurepip.bootstrap(); subprocess.check_call([sys.executable,"-m","pip","install","--disable-pip-version-check","--no-cache-dir","--retries","8","--timeout","60","--target=/tmp/blender-site","numpy"])'; then
                installed=1
                break
              fi
              echo "numpy install attempt ${attempt} failed; retrying."
              sleep 5
            done
            test "${installed}" = 1
          fi
          PYTHONPATH=/tmp/blender-site BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --background --python-expr 'import numpy; print("Validated Blender numpy:", numpy.__version__)'

      - name: Generate final hero and pet GLB assets in Blender
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          mkdir -p assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          PYTHONPATH=/tmp/blender-site BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --background --python tools/blender/run_visual_max_assets.py

      - name: Generate final monster GLB assets in Blender
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/monsters
          mkdir -p assets/3d/generated/monsters
          PYTHONPATH=/tmp/blender-site BLENDER_USER_CONFIG=/tmp/blender-config /opt/blender/blender --background --python tools/blender/honour_war_monster_assets.py

      - name: Convert GLBs to embedded PBR texture assets
        shell: bash
        env:
          PYTHONPATH: /tmp/blender-site
          BLENDER_USER_CONFIG: /tmp/blender-config
        run: |
          set -euo pipefail
          /opt/blender/blender --background --python tools/blender/enhance_generated_glbs.py

      - name: Validate final binary GLB structure
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/3d/generated -type f -name '*.glb' | wc -l)
          echo "Generated GLB count: ${count}"
          test "${count}" -eq 53
          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            test "$size" -ge 1024
            magic=$(dd if="$file" bs=1 count=4 2>/dev/null | od -An -t x1 | tr -d ' ')
            test "$magic" = "676c5446"
          done < <(find assets/3d/generated -type f -name '*.glb' | sort)

      - name: Automatically repair and run semantic and PBR GLB quality gate
        shell: bash
        env:
          BLENDER_EXECUTABLE: /opt/blender/blender
          PYTHONPATH: /tmp/blender-site
          BLENDER_USER_CONFIG: /tmp/blender-config
        run: |
          set -euo pipefail
          python3 tools/auto_repair_generated_glbs.py \
            --fix \
            --repair-attempts 3 \
            --repair-timeout 900 \
            --validator tools/validate_generated_glbs.py \
            --repair-script tools/blender/enhance_generated_glbs.py \
            --blender /opt/blender/blender

      - name: Create generated asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("assets/3d/generated")
          brief = Path("assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json")
          files = []
          for path in sorted(root.rglob("*.glb")):
              files.append({"path": path.as_posix(), "bytes": path.stat().st_size, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          manifest = {
              "pipeline": "Visual RAG -> Blender 4.2 -> PBR texture pass -> embedded GLB -> Godot 4",
              "geometry_source": "Blender procedural authored geometry",
              "texture_source": "Blender deterministic PBR texture pass",
              "substance_painter_status": "handoff-compatible; Substance 3D Painter is not executed in CI",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "visual_brief_sha256": hashlib.sha256(brief.read_bytes()).hexdigest(),
              "asset_count": len(files),
              "assets": files,
          }
          out = root / "GENERATED_ASSET_MANIFEST.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {out} with {len(files)} GLBs")
          PY

      - name: Upload generated GLBs as CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-generated-glbs
          path: |
            assets/3d/generated/**/*.glb
            assets/3d/generated/GENERATED_ASSET_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit generated GLBs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/generated assets/3d/visual_rag
          if git diff --cached --quiet; then
            echo "No new generated assets to commit."
            exit 0
          fi
          git commit -m "Generate final Honour War GLB visual assets"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
            else
              if git push origin HEAD:main; then
                echo "Generated GLB commit pushed successfully on attempt ${attempt}."
                exit 0
              fi
            fi
            echo "GLB main push attempt ${attempt} lost a main-branch race; retrying."
            sleep 5
          done
          echo "Failed to push generated GLB assets after 5 race-safe attempts."
          exit 1
