name: Honour War Final GLB Asset Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    paths:
      - "tools/blender/final_glb_build_trigger.txt"
      - "tools/blender/honour_war_visual_max_assets.py"
      - "tools/blender/run_visual_max_assets.py"
      - "tools/blender/honour_war_monster_assets.py"
      - "tools/blender/enhance_generated_glbs.py"
      - "tools/visual_rag/**"
      - "tools/validate_generated_glbs.py"
      - "shaders/ToonShader.gdshader"
      - "scripts/HWVisualMaxDirectorFixed.gd"
      - "scripts/HWToonMaterialDirector.gd"
      - "scripts/HWIsometricCamera.gd"
      - "scripts/EnvironmentCycle.gd"
      - "Main3D.tscn"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: honour-war-final-glb-assets
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-final-glb-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Visual RAG first
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_rag/honour_war_visual_rag.py
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.md
          echo "Visual RAG completed before Blender asset generation."

      - name: Download official Blender 4.2.23
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/blender.tar.xz \
            https://download.blender.org/release/Blender4.2/blender-4.2.23-linux-x64.tar.xz
          rm -rf /opt/blender /tmp/blender-site
          mkdir -p /opt/blender /tmp/blender-site
          tar -xJf /tmp/blender.tar.xz -C /opt/blender --strip-components=1
          /opt/blender/blender --version

      - name: Install Blender Python dependency for GLTF exporter
        shell: bash
        run: |
          set -euo pipefail
          /opt/blender/blender --background --python-expr 'import ensurepip,sys,subprocess; ensurepip.bootstrap(); subprocess.check_call([sys.executable,"-m","pip","install","--no-cache-dir","--target=/tmp/blender-site","numpy"])'
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python-expr 'import numpy; print("Blender numpy:", numpy.__version__)'

      - name: Generate final hero and pet GLB assets in Blender
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          mkdir -p assets/3d/generated/heroes assets/3d/generated/pets assets/3d/generated/characters
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/run_visual_max_assets.py

      - name: Generate final monster GLB assets in Blender
        shell: bash
        run: |
          set -euo pipefail
          rm -rf assets/3d/generated/monsters
          mkdir -p assets/3d/generated/monsters
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/honour_war_monster_assets.py

      - name: Convert GLBs to embedded PBR texture assets
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=/tmp/blender-site /opt/blender/blender --background --python tools/blender/enhance_generated_glbs.py

      - name: Validate final binary GLB structure
        shell: bash
        run: |
          set -euo pipefail
          count=$(find assets/3d/generated -type f -name '*.glb' | wc -l)
          echo "Generated GLB count: ${count}"
          test "${count}" -ge 53
          while IFS= read -r file; do
            size=$(stat -c%s "$file")
            echo "$file: $size bytes"
            test "$size" -ge 1024
            magic=$(dd if="$file" bs=1 count=4 2>/dev/null | od -An -t x1 | tr -d ' \n')
            test "$magic" = "676c5446"
          done < <(find assets/3d/generated -type f -name '*.glb' | sort)

      - name: Run semantic and PBR GLB quality gate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generated_glbs.py

      - name: Create generated asset manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("assets/3d/generated")
          brief = Path("assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json")
          files = []
          for path in sorted(root.rglob("*.glb")):
              files.append({
                  "path": path.as_posix(),
                  "bytes": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          manifest = {
              "pipeline": "Visual RAG -> Blender 4.2 -> PBR texture pass -> embedded GLB -> Godot 4",
              "geometry_source": "Blender procedural authored geometry",
              "texture_source": "Blender deterministic PBR texture pass",
              "substance_painter_status": "handoff-compatible; Substance 3D Painter is not executed in CI",
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "visual_brief_sha256": hashlib.sha256(brief.read_bytes()).hexdigest(),
              "asset_count": len(files),
              "assets": files,
          }
          out = root / "GENERATED_ASSET_MANIFEST.json"
          out.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {out} with {len(files)} GLBs")
          PY

      - name: Upload generated GLBs as CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-generated-glbs
          path: |
            assets/3d/generated/**/*.glb
            assets/3d/generated/GENERATED_ASSET_MANIFEST.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Commit generated GLBs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/generated assets/3d/visual_rag
          if git diff --cached --quiet; then
            echo "No new generated assets to commit."
            exit 0
          fi
          git commit -m "Generate final Honour War GLB visual assets"
          git push
