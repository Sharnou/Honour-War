name: Honour War town safety and warp world rules

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch world spawn rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("scripts/Main.gd")
          s=p.read_text(encoding="utf-8")
          original=s

          s=s.replace(
              "\tfor i in 5:\n\t\tspawn_monster()",
              "\tif TeleportSystem.is_dungeon(int(hero.get(\"map_id\",0))):\n\t\tfor i in 5:\n\t\t\tspawn_monster()",
              1,
          )

          s=s.replace(
              "\tif spawn_timer>=4.0 and monsters.size()<8:\n\t\tspawn_timer=0.0\n\t\tspawn_monster()",
              "\tif TeleportSystem.is_dungeon(int(hero.get(\"map_id\",0))) and spawn_timer>=4.0 and monsters.size()<8:\n\t\tspawn_timer=0.0\n\t\tspawn_monster()",
              1,
          )

          s=s.replace(
              "\tmonsters.clear()\n\tfor i in 4:\n\t\tspawn_monster()\n\tlog_message(\"Fast transmission to %s at X:%d Y:%d. Pet follows automatically.\" % [TeleportSystem.map_name(map_id),x,y])",
              "\tmonsters.clear()\n\tif TeleportSystem.is_dungeon(map_id):\n\t\tfor i in 4:\n\t\t\tspawn_monster()\n\tlog_message(\"Fast transmission to %s at X:%d Y:%d. Pet follows automatically.%s\" % [TeleportSystem.map_name(map_id),x,y,\" Combat zone populated.\" if TeleportSystem.is_dungeon(map_id) else \" Safe town: no monsters spawn here.\"])",
              1,
          )

          s=re.sub(
              r'(func spawn_monster\(\)->void:\n)(\tvar families:=)',
              r'\1\tif not TeleportSystem.is_dungeon(int(hero.get("map_id",0))):\n\t\treturn\n\2',
              s,
              count=1,
          )

          if s==original:
              print("World safety rules already applied.")
          else:
              p.write_text(s,encoding="utf-8")
              print("World safety rules patched.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd
          if git diff --cached --quiet; then
            echo "No Main.gd changes required."
            exit 0
          fi
          git commit -m "Prevent monsters from spawning in towns"
          git push
