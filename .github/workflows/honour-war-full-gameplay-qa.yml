name: Honour War Full Gameplay + Windows EXE QA

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "Main3D.tscn"
      - "scripts/**"
      - "tests/**"
      - "assets/**"
      - "tools/**"
      - ".github/workflows/honour-war-full-gameplay-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a verification run because another commit arrived while QA is
# running. The gameplay + EXE contract is serialized per ref and each revision
# must be allowed to finish and report its own result.
concurrency:
  group: honour-war-full-gameplay-qa-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

jobs:
  gameplay-contract:
    name: Full gameplay system integration QA
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Download Godot 4.7.2 from official release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "Godot_v4.7.2-stable_win64.exe.zip"
          $uri = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$asset"
          $zip = Join-Path $pwd $asset
          $out = Join-Path $pwd "godot.exe"
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --output "$zip" "$uri"
          if (-not (Test-Path $zip)) { throw "Godot archive download failed" }
          $size = (Get-Item $zip).Length
          if ($size -lt 70000000) { throw "Downloaded Godot archive is unexpectedly small/corrupt: $size bytes" }
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
            try {
              if ($archive.Entries.Count -lt 1) { throw "Godot archive contains no ZIP entries" }
            } finally { $archive.Dispose() }
          } catch { throw "Downloaded Godot archive failed ZIP integrity validation: $($_.Exception.Message)" }
          Expand-Archive -LiteralPath $zip -DestinationPath "$pwd\godot-extracted" -Force
          $candidate = Get-ChildItem -Path "$pwd\godot-extracted" -Filter "Godot_v4.7.2-stable_win64.exe" -File -Recurse | Select-Object -First 1
          if (-not $candidate) { throw "Godot 4.7.2 Windows executable was not found in archive" }
          Copy-Item -LiteralPath $candidate.FullName -Destination $out -Force
          if (-not (Test-Path $out)) { throw "Godot executable extraction failed" }
          Write-Host "Godot 4.7.2 downloaded and extracted successfully."

      - name: Install Godot 4.7.2 Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tpz = Join-Path $pwd "Godot_v4.7.2-stable_export_templates.tpz"
          $uri = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --output "$tpz" "$uri"
          if (-not (Test-Path $tpz)) { throw "Godot 4.7.2 export template archive was not downloaded" }
          $size = (Get-Item $tpz).Length
          if ($size -lt 70000000) { throw "Godot export template archive is unexpectedly small/corrupt: $size bytes" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          try {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($tpz)
            try {
              $requiredEntries = @("windows_debug_x86_64.exe","windows_release_x86_64.exe")
              foreach ($name in $requiredEntries) {
                $entry = $archive.Entries | Where-Object { $_.FullName -match "(^|/)$([regex]::Escape($name))$" } | Select-Object -First 1
                if (-not $entry) { throw "Godot export template archive is missing $name" }
              }
            } finally { $archive.Dispose() }
          } catch { throw "Godot export template archive failed ZIP validation: $($_.Exception.Message)" }

          $extract = Join-Path $pwd "godot-export-templates"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $tpz -DestinationPath $extract -Force

          # Godot 4.7.2 expects the two template executables directly in the
          # versioned export_templates directory. The .tpz may contain a
          # versioned templates/ subdirectory, so locate by filename and copy
          # the actual binaries rather than relying on archive layout.
          $templatesTarget = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $templatesTarget | Out-Null

          foreach ($name in @("windows_debug_x86_64.exe","windows_release_x86_64.exe")) {
            $found = Get-ChildItem -Path $extract -Filter $name -File -Recurse | Select-Object -First 1
            if (-not $found) { throw "Required Godot 4.7.2 Windows export template was not found after extraction: $name" }
            $destination = Join-Path $templatesTarget $name
            Copy-Item -LiteralPath $found.FullName -Destination $destination -Force
            $copied = Get-Item $destination
            if ($copied.Length -lt 1000000) { throw "Installed Godot export template is unexpectedly small: $name ($($copied.Length) bytes)" }
          }

          foreach ($name in @("windows_debug_x86_64.exe","windows_release_x86_64.exe")) {
            $path = Join-Path $templatesTarget $name
            if (-not (Test-Path $path)) { throw "Godot 4.7.2 Windows export template installation failed: $name" }
          }
          Write-Host "Installed Godot 4.7.2 x86_64 Windows export templates."


      - name: Validate editor and scripts
        shell: pwsh
        run: |
          & "$pwd\godot.exe" --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | Tee-Object godot-full-qa-editor.log
          if ($LASTEXITCODE -ne 0) { throw "Godot editor validation failed" }
          if (Select-String -Path godot-full-qa-editor.log -Pattern "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene") {
            throw "Godot reported script or scene errors"
          }

      - name: Run full gameplay runtime QA
        shell: pwsh
        run: |
          & "$pwd\godot.exe" --headless --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tests/full_gameplay_runtime_qa.gd 2>&1 | Tee-Object full-gameplay-runtime-qa.log
          if ($LASTEXITCODE -ne 0) { throw "Full gameplay runtime QA failed" }
          if (-not (Select-String -Path full-gameplay-runtime-qa.log -Pattern "FULL_GAMEPLAY_QA: PASS")) { throw "Gameplay QA PASS marker missing" }

      - name: Run authoritative HD gameplay/presentation contract
        shell: pwsh
        run: |
          & "$pwd\godot.exe" --headless --path . --script res://tests/hd_gameplay_presentation_contract_test.gd 2>&1 | Tee-Object hd-gameplay-contract.log
          if ($LASTEXITCODE -ne 0) { throw "HD gameplay/presentation contract failed" }

      - name: Run game completion contract
        shell: pwsh
        run: |
          & "$pwd\godot.exe" --headless --path . --script res://tests/game_completion_contract_test.gd 2>&1 | Tee-Object game-completion-contract.log
          if ($LASTEXITCODE -ne 0) { throw "Game completion contract failed" }

      - name: Run visual asset QA
        shell: pwsh
        run: |
          python tools/honour_war_visual_qa.py 2>&1 | Tee-Object visual-qa.log
          if ($LASTEXITCODE -ne 0) { throw "Visual asset QA failed" }

      - name: Reject duplicated monster silhouettes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_monster_visual_distinctness.py

      - name: Capture real game frame
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path visual-captures | Out-Null
          $log = Join-Path $pwd "real-game-capture.log"
          $err = Join-Path $pwd "real-game-capture.err"
          $godot = Join-Path $pwd "godot.exe"
          $movie = Join-Path $pwd "visual-captures\honour-war-real-game.png"

          # Use Godot's built-in Movie Maker PNG renderer. This captures the
          # actual rendered game frames without calling ViewportTexture.get_image()
          # or waiting on RenderingServer.frame_post_draw.
          $args = @(
            "--path", ".",
            "--display-driver", "windows",
            "--audio-driver", "Dummy",
            "--rendering-method", "gl_compatibility",
            "--rendering-driver", "opengl3",
            "--windowed",
            "--resolution", "1280x720",
            "--position", "0,0",
            "--write-movie", $movie,
            "--fixed-fps", "30",
            "--quit-after", "30"
          )

          Write-Host "Starting bounded Godot Movie Maker capture..."
          $p = Start-Process -FilePath $godot -ArgumentList $args -WorkingDirectory $pwd -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $deadline = (Get-Date).AddSeconds(120)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }

          if (-not $p.HasExited) {
            Write-Host "Real-game Movie Maker capture exceeded 120 seconds; terminating it."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            throw "Real game Movie Maker capture timed out after 120 seconds"
          }

          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue

          if ($p.ExitCode -ne 0) {
            throw "Real game Movie Maker capture failed with exit code $($p.ExitCode)"
          }

          # Godot's PNG Movie Writer emits an indexed PNG frame file. Normalize
          # the newest rendered frame to the stable QA filename.
          $frames = @(Get-ChildItem -Path "visual-captures" -Filter "honour-war-real-game*.png" -File | Sort-Object LastWriteTimeUtc)
          if ($frames.Count -eq 0) {
            throw "Godot completed without producing a PNG game frame"
          }
          $frame = $frames[-1]
          $movieFullPath = [System.IO.Path]::GetFullPath($movie)
          $frameFullPath = [System.IO.Path]::GetFullPath($frame.FullName)
          if ($frameFullPath -ne $movieFullPath) {
            Copy-Item -LiteralPath $frameFullPath -Destination $movie -Force
          }

          if (-not (Test-Path $movie)) { throw "Normalized real game screenshot was not produced" }

          Add-Type -AssemblyName System.Drawing
          $img = [System.Drawing.Image]::FromFile((Resolve-Path $movie))
          try {
            if ($img.Width -lt 640 -or $img.Height -lt 360) {
              throw "Captured game frame is below 640x360"
            }
            Write-Host "PASS: captured real-game frame is $($img.Width)x$($img.Height)"
          } finally {
            $img.Dispose()
          }

      - name: Upload gameplay QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-full-gameplay-qa-evidence
          path: |
            godot-full-qa-editor.log
            full-gameplay-runtime-qa.log
            hd-gameplay-contract.log
            game-completion-contract.log
            visual-qa.log
            real-game-capture.log
            real-game-capture.err
            visual-captures/honour-war-real-game.png
          if-no-files-found: ignore
          retention-days: 7

  windows-exe:
    name: Windows EXE export + runtime smoke
    runs-on: windows-latest
    needs: gameplay-contract
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Download Godot 4.7.2 from official release asset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $asset = "Godot_v4.7.2-stable_win64.exe.zip"
          $uri = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/$asset"
          $zip = Join-Path $pwd $asset
          $out = Join-Path $pwd "godot.exe"
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --output "$zip" "$uri"
          if (-not (Test-Path $zip)) { throw "Godot archive download failed" }
          $size = (Get-Item $zip).Length
          if ($size -lt 70000000) { throw "Downloaded Godot archive is unexpectedly small/corrupt: $size bytes" }
          Expand-Archive -LiteralPath $zip -DestinationPath "$pwd\godot-extracted" -Force
          $candidate = Get-ChildItem -Path "$pwd\godot-extracted" -Filter "Godot_v4.7.2-stable_win64.exe" -File -Recurse | Select-Object -First 1
          if (-not $candidate) { throw "Godot 4.7.2 Windows executable was not found in archive" }
          Copy-Item -LiteralPath $candidate.FullName -Destination $out -Force
          if (-not (Test-Path $out)) { throw "Godot executable extraction failed" }
          Write-Host "Godot 4.7.2 downloaded and extracted successfully."

      - name: Install Godot 4.7.2 Windows export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tpz = Join-Path $pwd "Godot_v4.7.2-stable_export_templates.tpz"
          $uri = "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          curl.exe --fail --location --retry 5 --retry-all-errors --connect-timeout 20 --output "$tpz" "$uri"
          if (-not (Test-Path $tpz)) { throw "Godot 4.7.2 export template archive was not downloaded" }
          $size = (Get-Item $tpz).Length
          if ($size -lt 70000000) { throw "Godot export template archive is unexpectedly small/corrupt: $size bytes" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          try {
            $archive = [System.IO.Compression.ZipFile]::OpenRead($tpz)
            try {
              foreach ($name in @("windows_debug_x86_64.exe","windows_release_x86_64.exe")) {
                $entry = $archive.Entries | Where-Object { $_.FullName -match "(^|/)$([regex]::Escape($name))$" } | Select-Object -First 1
                if (-not $entry) { throw "Godot export template archive is missing $name" }
              }
            } finally { $archive.Dispose() }
          } catch { throw "Godot export template archive failed ZIP validation: $($_.Exception.Message)" }
          $extract = Join-Path $pwd "godot-export-templates"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $tpz -DestinationPath $extract -Force
          $templatesTarget = Join-Path $env:APPDATA "Godot/export_templates/4.7.2.stable"
          New-Item -ItemType Directory -Force -Path $templatesTarget | Out-Null
          foreach ($name in @("windows_debug_x86_64.exe","windows_release_x86_64.exe")) {
            $found = Get-ChildItem -Path $extract -Filter $name -File -Recurse | Select-Object -First 1
            if (-not $found) { throw "Required Godot 4.7.2 Windows export template was not found after extraction: $name" }
            $destination = Join-Path $templatesTarget $name
            Copy-Item -LiteralPath $found.FullName -Destination $destination -Force
            $copied = Get-Item $destination
            if ($copied.Length -lt 1000000) { throw "Installed Godot export template is unexpectedly small: $name ($($copied.Length) bytes)" }
          }
          foreach ($name in @("windows_debug_x86_64.exe","windows_release_x86_64.exe")) {
            $path = Join-Path $templatesTarget $name
            if (-not (Test-Path $path)) { throw "Godot 4.7.2 Windows export template installation failed: $name" }
          }
          Write-Host "Installed Godot 4.7.2 x86_64 Windows export templates for the EXE job."

      - name: Export HonourWarHD.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\windows | Out-Null
          & "$pwd\godot.exe" --headless --path . --export-release "Windows Desktop" "build\windows\HonourWarHD.exe" 2>&1 | Tee-Object godot-export.log
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed" }
          if (-not (Test-Path "build\windows\HonourWarHD.exe")) { throw "HonourWarHD.exe was not produced" }

      - name: Run deterministic gameplay smoke test in exported EXE
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build\windows\HonourWarHD.exe").Path
          $log = (Resolve-Path ".").Path + "\honour-war-exe-smoke.log"
          $err = (Resolve-Path ".").Path + "\honour-war-exe-smoke.err"
          $p = Start-Process -FilePath $exe -ArgumentList "--qa-smoke-test","--rendering-method","gl_compatibility","--rendering-driver","opengl3" -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            throw "Exported EXE gameplay smoke test timed out"
          }
          Get-Content $log -ErrorAction SilentlyContinue
          Get-Content $err -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "Exported EXE gameplay smoke test failed with exit code $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern "EXE_QA_SMOKE_TEST: PASS")) { throw "Exported EXE gameplay smoke PASS marker missing" }
          Write-Host "PASS: exported EXE executed deterministic gameplay smoke test."

      - name: Launch and test exported EXE runtime
        shell: pwsh
        run: |
          $exe = (Resolve-Path "build\windows\HonourWarHD.exe").Path
          $log = (Resolve-Path ".").Path + "\honour-war-exe-runtime.log"
          $err = (Resolve-Path ".").Path + "\honour-war-exe-runtime.err"
          $p = Start-Process -FilePath $exe -ArgumentList "--rendering-method","gl_compatibility","--rendering-driver","opengl3" -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $log -RedirectStandardError $err -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Get-Content $log -ErrorAction SilentlyContinue
            Get-Content $err -ErrorAction SilentlyContinue
            throw "HonourWarHD.exe exited during startup with code $($p.ExitCode)"
          }
          Start-Sleep -Seconds 50
          if ($p.HasExited) {
            throw "HonourWarHD.exe crashed/exited during the 60-second runtime test; exit code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "PASS: exported HonourWarHD.exe stayed alive for 60 seconds."
      - name: Scan EXE runtime logs for fatal errors
        shell: pwsh
        run: |
          if (Test-Path honour-war-exe-runtime.err) {
            $fatal = Select-String -Path honour-war-exe-runtime.err -Pattern "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene|FATAL"
            if ($fatal) { $fatal | ForEach-Object { Write-Host $_ }; throw "Fatal runtime errors found in EXE stderr" }
          }

      - name: Package only after full QA passes
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\* -DestinationPath HonourWar-Windows-Full-QA.zip -Force
          if (-not (Test-Path HonourWar-Windows-Full-QA.zip)) { throw "Verified ZIP was not created" }

      - name: Upload verified EXE ZIP
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-windows-full-qa
          path: HonourWar-Windows-Full-QA.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload EXE logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-windows-full-qa-logs
          path: |
            godot-export.log
            honour-war-exe-runtime.log
            honour-war-exe-runtime.err
            honour-war-exe-smoke.log
            honour-war-exe-smoke.err
          if-no-files-found: ignore

# Full gameplay QA is intentionally retriggered on every gameplay/runtime script revision.
