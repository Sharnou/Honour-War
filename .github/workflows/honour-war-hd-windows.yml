name: Honour War HD Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_BINARY: "Godot_v4.7.2-stable_win64.exe"
  GODOT_TEMPLATE: "Godot_v4.7.2-stable_export_templates.tpz"

concurrency:
  group: honour-war-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build-windows:
    name: Build HonourWarHD.exe with Godot 4.7.2
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Report validation source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          $expected = $env:GITHUB_SHA
          Write-Host "Validation HEAD: $actual"
          Write-Host "Workflow SHA:    $expected"
          if ($actual -ne $expected) { throw 'Validation checkout does not match triggering commit' }

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/$env:GODOT_BINARY.zip",
            "https://github.com/godotengine/godot/releases/download/$env:GODOT_TAG/$env:GODOT_BINARY.zip"
          )

          $downloaded = $false
          for ($round = 1; $round -le 8 -and -not $downloaded; $round++) {
            foreach ($url in $urls) {
              Write-Host ("Godot download attempt {0}: {1}" -f $round, $url)
              Remove-Item -Force -ErrorAction SilentlyContinue godot.zip
              try {
                Invoke-WebRequest -Uri $url -OutFile 'godot.zip' -UseBasicParsing -TimeoutSec 600
                Expand-Archive -Path 'godot.zip' -DestinationPath 'godot-download-check' -Force
                $exe = Get-ChildItem -Path 'godot-download-check' -Filter $env:GODOT_BINARY -File -Recurse | Select-Object -First 1
                if ($null -ne $exe) {
                  $downloaded = $true
                  Write-Host "Downloaded and validated Godot archive from $url"
                  break
                }
                Write-Warning "Archive from $url did not contain $env:GODOT_BINARY."
              } catch {
                Write-Warning "Godot download/validation failed: $($_.Exception.Message)"
              }
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'godot-download-check'
              Start-Sleep -Seconds 3
            }
          }

          if (-not $downloaded) {
            throw "Could not download and validate Godot $env:GODOT_VERSION after retrying both official endpoints."
          }

          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue 'godot-dist'
          Expand-Archive -Path 'godot.zip' -DestinationPath 'godot-dist' -Force
          $exe = Get-ChildItem -Path 'godot-dist' -Filter $env:GODOT_BINARY -File -Recurse | Select-Object -First 1
          if ($null -eq $exe) { throw "Godot executable $env:GODOT_BINARY was not found after extraction" }
          Copy-Item $exe.FullName 'godot.exe' -Force
          Get-Item 'godot.exe' | Select-Object FullName,Length

      - name: Download Godot 4.7.2 export templates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $urls = @(
            "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/$env:GODOT_TEMPLATE",
            "https://github.com/godotengine/godot/releases/download/$env:GODOT_TAG/$env:GODOT_TEMPLATE"
          )

          $downloaded = $false
          for ($round = 1; $round -le 8 -and -not $downloaded; $round++) {
            foreach ($url in $urls) {
              Write-Host ("Godot export-template download attempt {0}: {1}" -f $round, $url)
              Remove-Item -Force -ErrorAction SilentlyContinue templates.tpz
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue templates-check
              try {
                Invoke-WebRequest -Uri $url -OutFile 'templates.tpz' -UseBasicParsing -TimeoutSec 600
                Expand-Archive -Path 'templates.tpz' -DestinationPath 'templates-check' -Force
                $marker = Get-ChildItem -Path 'templates-check' -Filter 'windows_release_x86_64.exe' -File -Recurse | Select-Object -First 1
                if ($null -ne $marker) {
                  $downloaded = $true
                  Write-Host "Downloaded and validated export-template archive from $url"
                  break
                }
                Write-Warning "Archive from $url did not contain windows_release_x86_64.exe."
              } catch {
                Write-Warning "Export-template download/validation failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds 3
            }
          }

          if (-not $downloaded) {
            throw "Could not download and validate Godot $env:GODOT_VERSION export templates after retrying both official endpoints."
          }

          $templatesDir = Join-Path $env:APPDATA 'Godot\export_templates\4.7.2.stable'
          New-Item -ItemType Directory -Force -Path $templatesDir | Out-Null
          Expand-Archive -Path 'templates.tpz' -DestinationPath $templatesDir -Force
          $inner = Join-Path $templatesDir 'templates'
          if (Test-Path $inner) {
            Get-ChildItem -Path $inner -Recurse -File | ForEach-Object {
              Copy-Item $_.FullName -Destination $templatesDir -Force
            }
          }
          $required = Join-Path $templatesDir 'windows_release_x86_64.exe'
          if (-not (Test-Path $required)) { throw 'Godot Windows 4.7.2 release export template was not installed' }
          @('version.txt','windows_release_x86_64.exe') | ForEach-Object {
            $p = Join-Path $templatesDir $_
            if (Test-Path $p) { Get-Item $p | Select-Object Name,Length }
          }

      - name: Import project and validate scripts/scenes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\godot.exe --headless --editor --path . --quit 2>&1 | Tee-Object -FilePath godot-windows-validation.log
          if ($LASTEXITCODE -ne 0) { throw "Godot editor validation failed with exit code $LASTEXITCODE" }
          $errors = Select-String -Path godot-windows-validation.log -Pattern 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene'
          if ($errors) { $errors | ForEach-Object { $_.Line }; throw 'Godot reported script/scene loading errors' }

      - name: Export Windows release EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'build/windows' | Out-Null
          & .\godot.exe --headless --path . --export-release 'Windows Desktop' 'build/windows/HonourWarHD.exe' 2>&1 | Tee-Object -FilePath godot-export.log
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path 'build/windows/HonourWarHD.exe')) { throw 'EXE was not created' }
          Get-Item 'build/windows/HonourWarHD.exe' | Select-Object FullName,Length

      - name: Launch exported EXE smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $proc = Start-Process -FilePath 'build/windows/HonourWarHD.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) { throw "EXE exited early with code $($proc.ExitCode)" }
          } else {
            Stop-Process -Id $proc.Id -Force
          }

      - name: Package build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $pwd 'HonourWarHD-Windows.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'build/windows/*' -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw 'Windows ZIP package was not created' }
          Get-Item $zip | Select-Object FullName,Length

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: HonourWarHD-Windows
          path: |
            HonourWarHD-Windows.zip
            godot-windows-validation.log
            godot-export.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
