name: Repair Godot runtime files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply safe Godot 4.2 fixes
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/Main.gd")
          s = p.read_text(encoding="utf-8")
          old = 'var item:=CLASSES[hero["class"]]["weapon"]+" Core"'
          new = 'var item:String=CLASSES[hero["class"]]["weapon"]+" Core"'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding="utf-8")
          elif new not in s:
              raise SystemExit("Expected Main.gd craft item declaration was not found")

          p = Path("scripts/SkillUI.gd")
          s = p.read_text(encoding="utf-8")
          old_block = '''func _ready()->void:
          \tgame=get_parent()
          \tcombat_vfx=CombatVFX.new()
          \tgame.add_child(combat_vfx)
          \tcombat_vfx.setup(game)
          \tbuild()
          \tpanel.visible=false
          \tcall_deferred("refresh")
          '''
          new_block = '''func _ready()->void:
          \tgame=get_parent()
          \tcombat_vfx=CombatVFX.new()
          \tcall_deferred("_add_combat_vfx")
          \tbuild()
          \tpanel.visible=false
          \tcall_deferred("refresh")

          func _add_combat_vfx()->void:
          \tif combat_vfx==null or game==null:
          \t\treturn
          \tif combat_vfx.get_parent()==null:
          \t\tgame.add_child(combat_vfx)
          \tcombat_vfx.setup(game)
          '''
          if old_block in s:
              s = s.replace(old_block, new_block, 1)
              p.write_text(s, encoding="utf-8")
          elif 'call_deferred("_add_combat_vfx")' not in s or 'func _add_combat_vfx()->void:' not in s:
              raise SystemExit("Expected SkillUI.gd _ready block was not found")
          PY

          if git diff --quiet -- scripts/Main.gd scripts/SkillUI.gd; then
            echo "No repair changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/Main.gd scripts/SkillUI.gd
          git commit -m "Fix Godot 4.2 runtime parse and child setup errors"
          git push
