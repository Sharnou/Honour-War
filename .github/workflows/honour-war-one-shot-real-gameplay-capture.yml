name: Honour War One-Shot Real Gameplay Capture

on:
  push:
    branches: [main]

concurrency:
  group: honour-war-one-shot-real-gameplay-capture
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  capture:
    if: "${{ !contains(github.event.head_commit.message, '[skip ci]') }}"
    runs-on: [self-hosted, windows, unreal-engine-5.8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate runtime contracts
        shell: pwsh
        run: |
          python tools/rejected_systems_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/full_game_test_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/content_catalog_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/skill_system_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/unreal_engine_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build actual Unreal 5.8 Windows EXE
        shell: pwsh
        env:
          UNREAL_ENGINE_ROOT: C:\Program Files\Epic Games\UE_5.8
        run: powershell -ExecutionPolicy Bypass -File Build/Build-HonourWar.ps1 -Package

      - name: Launch actual EXE and capture gameplay framebuffer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File Build/Capture-HonourWar.ps1

      - name: Verify screenshot is real runtime output
        shell: pwsh
        run: |
          $img = "Build/HonourWar-real-runtime.png"
          if (!(Test-Path $img)) { throw "Missing real runtime screenshot." }
          python tools/unreal_runtime_screenshot_qa.py $img
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store verified gameplay screenshot in repository
        shell: pwsh
        run: |
          git config user.name "Honour War Runtime QA"
          git config user.email "runtime-qa@users.noreply.github.com"
          Copy-Item Build/HonourWar-real-runtime.png verified-honour-war-gameplay.png -Force
          git add verified-honour-war-gameplay.png
          git commit -m "[skip ci] Add verified Unreal gameplay screenshot"
          git push origin HEAD:main
