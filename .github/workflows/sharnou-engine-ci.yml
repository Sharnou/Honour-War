name: Sharnou Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_ROOT) {
            $cmd = Get-Command vcpkg -ErrorAction Stop
            "VCPKG_ROOT=$(Split-Path $cmd.Source -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Install native dependencies from manifest
        shell: pwsh
        working-directory: Engine/SharnouEngine
        run: |
          vcpkg install --triplet x64-windows

      - name: Configure CMake / Visual Studio 2022
        shell: pwsh
        run: |
          cmake -S Engine/SharnouEngine -B Engine/SharnouEngine/out/ci -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build Engine/SharnouEngine/out/ci --config Release --parallel

      - name: Run native self-test
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Engine/SharnouEngine/out/ci/Release/SharnouEngine.exe" --self-test
          if ($LASTEXITCODE -ne 0) { throw "Sharnou Engine self-test failed: $LASTEXITCODE" }

      - name: Native 300-second gameplay soak
        shell: pwsh
        timeout-minutes: 2
        run: |
          $env:SHARNOU_ENGINE_TEST_LOG = "$env:GITHUB_WORKSPACE/sharnou-runtime-test.log"
          & "$env:GITHUB_WORKSPACE/Engine/SharnouEngine/out/ci/Release/SharnouEngine.exe" --runtime-test
          if ($LASTEXITCODE -ne 0) { throw "Sharnou Engine runtime soak failed: $LASTEXITCODE" }

      - name: Upload native runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharnou-engine-runtime-log
          path: sharnou-runtime-test.log
          if-no-files-found: warn

      - name: Sharnou Engine contract QA
        shell: pwsh
        run: |
          python tools/sharnou_engine_qa.py
