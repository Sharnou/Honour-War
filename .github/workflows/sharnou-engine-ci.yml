name: Honour War Sharnou Stack Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  sharnou-stack-policy-and-runtime:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce canonical Honour War identity
        shell: pwsh
        run: |
          $manifest = Get-Content "$env:GITHUB_WORKSPACE/Tools/SharnouIDE/honour-war.spp.json" -Raw | ConvertFrom-Json
          if ($manifest.canonical_identity.project_id -ne 'honour-war' -or $manifest.canonical_identity.canonical -ne $true) { throw 'Honour War is not canonical.' }
          if ($manifest.ide.id -ne 'Sharnou-IDE') { throw 'IDE identity mismatch.' }
          if ($manifest.ide.repository -ne 'https://github.com/Sharnou/Sharnou-IDE') { throw 'Canonical IDE repository mismatch.' }
          if ($manifest.engine.id -ne 'SharnouEngine') { throw 'Engine identity mismatch.' }
          if ($manifest.engine.repository -ne 'https://github.com/Sharnou/Sharnou-Engine') { throw 'Canonical engine repository mismatch.' }
          if ($manifest.build_policy.network_downloads -ne $false) { throw 'Network downloads are forbidden.' }
          if ($manifest.build_policy.external_tool_bootstrap -ne $false) { throw 'External tool bootstrap is forbidden.' }
          if ($manifest.build_policy.external_ide_authoring -ne $false) { throw 'External IDE authoring is forbidden.' }
          if ($manifest.asset_format_policy.runtime_visual_format -ne '.avif') { throw 'AVIF-only runtime visual policy is missing.' }
          if ($manifest.asset_format_policy.rejected_runtime_visual_formats -notcontains '.gltf') { throw 'GLTF rejection policy is missing.' }
          if ($manifest.asset_format_policy.rejected_runtime_visual_formats -notcontains '.glb') { throw 'GLB rejection policy is missing.' }
          if ($manifest.asset_format_policy.rejected_runtime_visual_formats -notcontains '.ktx2') { throw 'KTX2 rejection policy is missing.' }
          $forbidden = @('Visual Studio','MSBuild','Windows SDK','CMake','vcpkg','Unity','Unreal Engine')
          foreach ($name in $forbidden) {
            if ($manifest.forbidden_project_dependencies -notcontains $name) { throw "Missing forbidden dependency policy: $name" }
          }
          Write-Host 'PASS: canonical Honour War -> Sharnou-IDE -> SharnouEngine binding.'

      - name: Reject forbidden active build files
        shell: pwsh
        run: |
          $patterns = @('CMakeLists.txt','CMakePresets.json','vcpkg.json','*.sln','*.slnx','*.vcxproj','*.vcxproj.filters')
          foreach ($pattern in $patterns) {
            $hits = Get-ChildItem "$env:GITHUB_WORKSPACE" -Recurse -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -like $pattern -and $_.FullName -notmatch '[\\/]legacy[\\/]' }
            if ($hits) { $hits | ForEach-Object { Write-Host "FORBIDDEN ACTIVE BUILD FILE: $($_.FullName)" }; throw "Forbidden build path detected: $pattern" }
          }
          Write-Host 'PASS: no rejected IDE/build project files are active.'

      - name: Validate SPP source structure and asset commands
        shell: pwsh
        run: |
          $spp = Get-Content "$env:GITHUB_WORKSPACE/Tools/SharnouIDE/project/main.spp" -Raw
          foreach ($required in @('project_bind','generate_content','actor_spawn','set_pos','bind_mesh','texture_avif')) {
            if ($spp -notmatch [regex]::Escape($required)) { throw "SPP command missing: $required" }
          }
          Write-Host 'PASS: Honour War SPP source contract and AVIF-only visual command.'

      - name: Validate runtime asset extensions
        shell: pwsh
        run: |
          $roots = @("$env:GITHUB_WORKSPACE/Content", "$env:GITHUB_WORKSPACE/assets") | Where-Object { Test-Path $_ }
          foreach ($root in $roots) {
            Get-ChildItem $root -Recurse -File -Force -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.Extension -in @('.png','.jpg','.jpeg','.webp','.gif','.bmp','.tga','.dds','.gltf','.glb','.ktx2')) { throw "Rejected active visual asset format: $($_.FullName)" }
            }
          }
          Write-Host 'PASS: active runtime visual extensions are AVIF-only; GLTF/GLB/KTX2 are rejected.'

      - name: Validate SharnouEngine-only generation contract
        shell: pwsh
        run: |
          python tools/validate_art_generators.py

      - name: Run deterministic SharnouEngine source validator tests
        shell: pwsh
        run: |
          python Tools/tests/test_sharnou_engine_validator.py

      - name: Execute automatic Sharnou IDE to SharnouEngine generation
        if: ${{ hashFiles('Build/Runtime/SharnouEngine.exe') != '' }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/Tools/SharnouIDE/SharnouIDE.ps1" -Command generate
          if ($LASTEXITCODE -ne 0) { throw "Automatic Sharnou generation failed: $LASTEXITCODE" }

      - name: Run native Sharnou Engine self-test after generation
        if: ${{ hashFiles('Build/Runtime/SharnouEngine.exe') != '' }}
        shell: pwsh
        run: |
          $env:SHARNOU_IDE_SESSION = '1'
          $env:SHARNOU_IDE_REPOSITORY = 'https://github.com/Sharnou/Sharnou-IDE'
          $env:SHARNOU_ENGINE_ID = 'SharnouEngine'
          $env:SHARNOU_PROJECT_ID = 'honour-war'
          & "$env:GITHUB_WORKSPACE/Build/Runtime/SharnouEngine.exe" '--self-test'
          if ($LASTEXITCODE -ne 0) { throw "Sharnou Engine self-test failed: $LASTEXITCODE" }
      - name: Runtime artifact evidence
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE/Build/Runtime/SharnouEngine.exe") {
            Write-Host 'PASS: Native Sharnou Engine runtime artifact is present and tested.'
          } else {
            Write-Host 'INFO: No native runtime artifact is checked into this source tree; no compiler/toolchain was installed or downloaded.'
          }
