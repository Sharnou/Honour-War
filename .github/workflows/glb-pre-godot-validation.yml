name: Honour War GLB Pre-Godot Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/3d/generated/**/*.glb'
      - 'tools/validate_glb_materials.py'
      - 'tools/blender/**'
      - '.github/workflows/glb-pre-godot-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every serialized GLB primitive/material
        run: python3 tools/validate_glb_materials.py assets/3d/generated
      - name: Confirm Godot project is present
        run: test -f project.godot && test -f scenes/Main3D.tscn
