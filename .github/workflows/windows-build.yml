name: Honour War Windows Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'assets/**'
      - 'shaders/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  GODOT_BINARY: 'Godot_v4.7.2-stable_win64.exe'

concurrency:
  group: honour-war-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact build commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout SHA mismatch: $actual != $env:GITHUB_SHA" }

      - name: Download Godot 4.7.2 stable
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $urls = @(
            "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_TAG/$env:GODOT_BINARY.zip",
            "https://github.com/godotengine/godot/releases/download/$env:GODOT_TAG/$env:GODOT_BINARY.zip"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              if ((Get-Item $zip).Length -gt 10000000) { $ok = $true; break }
            } catch { Write-Host "Download failed: $url" }
          }
          if (-not $ok) { throw 'Unable to download Godot 4.7.2 Windows editor.' }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $godot = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter $env:GODOT_BINARY -Recurse | Select-Object -First 1
          if ($null -eq $godot) { throw 'Godot executable not found after extraction.' }
          & $godot.FullName --version
          "GODOT_EXE=$($godot.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Import project and reject script errors
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | Tee-Object godot-windows-import.log
          if ($LASTEXITCODE -ne 0) { throw "Godot import returned exit code $LASTEXITCODE" }
          $bad = Select-String -Path godot-windows-import.log -Pattern 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene'
          if ($bad) { $bad | ForEach-Object { $_.Line }; throw 'Godot reported script/scene errors during Windows build import.' }

      - name: Run login registration character QA
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path . --script res://tests/login_registration_character_ui_test.gd 2>&1 | Tee-Object login-registration-character-ui.log
          if ($LASTEXITCODE -ne 0) { throw 'Login/registration/Create New Character QA failed.' }

      - name: Run core completeness QA
        shell: pwsh
        run: |
          & $env:GODOT_EXE --headless --path . --script res://tests/game_completion_contract_test.gd 2>&1 | Tee-Object game-completeness.log
          if ($LASTEXITCODE -ne 0) { throw 'Game completeness QA failed.' }

      - name: Export Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Windows Desktop' build/windows/HonourWarHD.exe 2>&1 | Tee-Object windows-export.log
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path build/windows/HonourWarHD.exe)) { throw 'HonourWarHD.exe was not produced.' }
          if ((Get-Item build/windows/HonourWarHD.exe).Length -lt 1000000) { throw 'HonourWarHD.exe is unexpectedly small.' }

      - name: Verify exported EXE and embedded PCK
        shell: pwsh
        run: |
          $exe = Get-Item build/windows/HonourWarHD.exe
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -notmatch 'GDPC') { throw 'Embedded Godot PCK signature was not found in the exported executable.' }
          Write-Host "EXE size: $($exe.Length) bytes"

      - name: Runtime smoke test
        shell: pwsh
        run: |
          $stdout = Join-Path $PWD 'windows-runtime-smoke.stdout.log'
          $stderr = Join-Path $PWD 'windows-runtime-smoke.stderr.log'
          $exe = (Resolve-Path build/windows/HonourWarHD.exe).Path
          $proc = Start-Process -FilePath $exe -ArgumentList @('--rendering-method','gl_compatibility','--rendering-driver','opengl3','--path','.') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          if ($proc.HasExited) {
            Write-Host "HonourWarHD.exe exited during the 15-second startup smoke test with code $($proc.ExitCode)."
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw 'Windows game exited before the startup smoke test completed.'
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'HonourWarHD.exe survived the 15-second Windows startup smoke test.'
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue

      - name: Package final Windows ZIP
        shell: pwsh
        run: |
          $staging = Join-Path $PWD 'HonourWarHD-Windows'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item build/windows/HonourWarHD.exe $staging -Force
          Copy-Item project.godot $staging -Force
          Copy-Item README.md $staging -Force
          @"
          Honour War HD Windows Build
          Godot $env:GODOT_VERSION
          Build commit: $env:GITHUB_SHA
          Main executable: HonourWarHD.exe
          Tested: project import, login/registration/Create New Character QA, core completeness QA, Windows export, 15-second startup smoke test.
          "@ | Set-Content (Join-Path $staging 'BUILD_INFO.txt')
          if (Test-Path HonourWarHD-Windows.zip) { Remove-Item HonourWarHD-Windows.zip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath HonourWarHD-Windows.zip -CompressionLevel Optimal
          if ((Get-Item HonourWarHD-Windows.zip).Length -lt 1000000) { throw 'Final Windows ZIP is unexpectedly small.' }

      - name: Upload final Windows ZIP
        uses: actions/upload-artifact@v7
        with:
          name: HonourWarHD-Windows
          path: HonourWarHD-Windows.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: HonourWarHD-Windows-diagnostics
          path: |
            godot-windows-import.log
            login-registration-character-ui.log
            game-completeness.log
            windows-export.log
            windows-runtime-smoke.stdout.log
            windows-runtime-smoke.stderr.log
          if-no-files-found: ignore
          retention-days: 14
