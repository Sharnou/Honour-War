name: Honour War Reference Preview
on:
  push:
    branches: [main]
    paths:
      - "Screenshot/ChatGPT Image Sep 16, 2026, 12_22_47 AM.png"
      - ".github/workflows/reference-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create reference thumbnail
        run: |
          python3 -m pip install pillow -q
          python3 - <<'PY'
          from PIL import Image
          src='Screenshot/ChatGPT Image Sep 16, 2026, 12_22_47 AM.png'
          img=Image.open(src).convert('RGB')
          img.thumbnail((640,360), Image.Resampling.LANCZOS)
          img.save('/tmp/honour-war-reference-preview.jpg', quality=92)
          print('REFERENCE_SIZE', Image.open(src).size)
          print('PREVIEW_SIZE', img.size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: honour-war-reference-preview
          path: /tmp/honour-war-reference-preview.jpg
          retention-days: 2
