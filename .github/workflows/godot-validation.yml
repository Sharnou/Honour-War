name: Godot project validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

# Validate only the newest main revision. GitHub Actions otherwise permits
# multiple workflow runs to execute concurrently; canceling stale validation
# saves runner time while keeping the newest commit as the authoritative gate.
concurrency:
  group: honour-war-godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"

      - name: Run Game3D integrity regression QA
        shell: bash
        run: python3 tools/game3d_integrity_qa.py

      - name: Download and verify Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf godot.zip godot-dist
          mkdir -p godot-dist
          urls=(
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_BINARY}.zip"
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_BINARY}.zip"
          )
          downloaded=0
          for url in "${urls[@]}"; do
            echo "Trying ${url}"
            rm -f godot.zip
            if curl --location --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --connect-timeout 30 --max-time 600 --output godot.zip "${url}"; then
              if unzip -tq godot.zip >/dev/null 2>&1; then
                downloaded=1
                echo "Downloaded a valid Godot archive from ${url}"
                break
              fi
            fi
          done
          if [ "${downloaded}" -ne 1 ]; then
            echo "ERROR: Could not download a valid Godot ${GODOT_VERSION} archive."
            exit 1
          fi
          unzip -q godot.zip -d godot-dist
          godot_path="$(find godot-dist -type f -name "${GODOT_BINARY}" -print -quit)"
          test -n "${godot_path}"
          chmod +x "${godot_path}"
          version_output="$("${godot_path}" --version 2>&1)"
          echo "Godot version: ${version_output}"
          printf '%s\n' "${version_output}" | grep -E '^4\.7\.2\.stable' >/dev/null
          cp "${godot_path}" "./${GODOT_BINARY}"
          chmod +x "./${GODOT_BINARY}"

      - name: Run SS rental regression QA
        shell: bash
        run: python3 tools/ss_rental_qa.py

      - name: Validate scripts, scenes, and Godot 4.7 target
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'config/features=PackedStringArray("4.7")' project.godot >/dev/null
          ./"${GODOT_BINARY}" --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | tee godot-validation.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene' godot-validation.log; then
            echo 'Godot validation reported errors.'
            exit 1
          fi

      - name: Upload Godot validation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-project-validation-log
          path: godot-validation.log
          if-no-files-found: ignore
