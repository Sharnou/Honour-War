name: Godot project validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64

      - name: Validate scripts and scenes
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --editor --path . --quit 2>&1 | tee godot-validation.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene" godot-validation.log; then
            echo "Godot validation reported errors."
            exit 1
          fi
