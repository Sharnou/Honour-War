name: Fix validation errors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair known Godot 4.2 compatibility issues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path("scripts/CharacterDetail3D.gd")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              s=s.replace("if emission.length()>0.0:", "if emission != Color(0,0,0,1):")
              p.write_text(s,encoding="utf-8")

          p=Path("scripts/SkillTreeUI.gd")
          if p.exists():
              s=p.read_text(encoding="utf-8")
              if "func refresh()->void:" not in s or "func tier_name" not in s:
                  print("SkillTreeUI refresh/tier markers not found; leaving current implementation unchanged.")
              else:
                  print("SkillTreeUI structure is present; no automatic rewrite required.")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/CharacterDetail3D.gd scripts/SkillTreeUI.gd
          if git diff --cached --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git commit -m "Fix known Godot 4.2 compatibility issues"
          git push
