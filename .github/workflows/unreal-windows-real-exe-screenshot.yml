name: Honour War Unreal 5.8 Real EXE Screenshot

on:
  workflow_dispatch:

concurrency:
  group: honour-war-unreal-windows-real-exe-screenshot.yml
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, windows, unreal-engine-5.8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate permanent Honour War exclusions
        shell: pwsh
        run: python tools/rejected_systems_qa.py

      - name: Validate full-game runtime readiness contract
        shell: pwsh
        run: python tools/full_game_test_contract_qa.py

      - name: Validate content catalog
        shell: pwsh
        run: python tools/content_catalog_qa.py

      - name: Validate repository contract
        shell: pwsh
        run: |
          python tools/unreal_engine_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_camera_controls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/honour_war_progression_contract_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/visual_gap_register_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package Windows EXE
        shell: pwsh
        env:
          UNREAL_ENGINE_ROOT: C:\Program Files\Epic Games\UE_5.8
        run: powershell -ExecutionPolicy Bypass -File Build/Build-HonourWar.ps1 -Package

      - name: Verify actual EXE exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Build\Windows\HonourWar -Recurse -Filter HonourWar.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $exe) { throw "HonourWar.exe was not produced by the Unreal package step." }
          if ($exe.Length -lt 1000000) { throw "HonourWar.exe is unexpectedly small: $($exe.Length) bytes." }
          Write-Host "REAL_EXE_PASS: $($exe.FullName) size=$($exe.Length) bytes"

      - name: Create Windows 10 distribution ZIP
        shell: pwsh
        run: |
          $zip = "Build/HonourWar-Windows10.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "Build/Windows/HonourWar/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "Windows 10 ZIP was not created." }
          Write-Host "WINDOWS10_ZIP_PASS: $zip"

      - name: Launch actual EXE and capture framebuffer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File Build/Capture-HonourWar.ps1

      - name: Validate real screenshot content
        shell: pwsh
        run: python tools/unreal_runtime_screenshot_qa.py Build/HonourWar-real-runtime.png

      - name: Upload Windows 10 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-real-windows-10-zip
          path: Build/HonourWar-Windows10.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload actual Windows EXE package
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-real-windows-exe
          path: Build/Windows/HonourWar/
          if-no-files-found: error
          retention-days: 30

      - name: Upload real gameplay screenshot
        uses: actions/upload-artifact@v4
        with:
          name: honour-war-real-unreal-exe-screenshot
          path: Build/HonourWar-real-runtime.png
          if-no-files-found: error
          retention-days: 30
