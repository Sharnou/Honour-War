name: Honour War real game screenshot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-real-game-screenshot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact game revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Verify exact revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Download Godot 4.7.2 stable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot-dist
          curl --location --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            --output godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_TAG}/${GODOT_BINARY}.zip"
          unzip -q godot.zip -d godot-dist
          godot_path="$(find godot-dist -type f -name "${GODOT_BINARY}" -print -quit)"
          test -n "${godot_path}"
          chmod +x "${godot_path}"
          "${godot_path}" --version
          cp "${godot_path}" "./${GODOT_BINARY}"
          chmod +x "./${GODOT_BINARY}"

      - name: Validate game scripts and scene
        shell: bash
        run: |
          set -euo pipefail
          ./"${GODOT_BINARY}" --headless --editor --path . \
            --rendering-method gl_compatibility --rendering-driver opengl3 --quit \
            2>&1 | tee screenshot-scene-validation.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene' screenshot-scene-validation.log; then
            exit 1
          fi

      - name: Run the actual game with Xvfb and capture rendered frame
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null
          rm -rf artifacts
          mkdir -p artifacts
          xvfb-run -a -s '-screen 0 1920x1080x24 -ac +extension GLX +render -noreset' \
            ./"${GODOT_BINARY}" --path . \
            --rendering-method gl_compatibility --rendering-driver opengl3 \
            --script res://tests/capture_real_game_screenshot.gd \
            2>&1 | tee real-game-screenshot.log
          grep -F 'REAL_GAME_SCREENSHOT_PASS:' real-game-screenshot.log >/dev/null
          test -s artifacts/honour-war-real-game.png
          grep -F 'REAL_GAME_SCREENSHOT_FRAME:' real-game-screenshot.log >/dev/null
          grep -F 'REAL_GAME_SCREENSHOT_PASS:' real-game-screenshot.log >/dev/null
          file artifacts/honour-war-real-game.png

      - name: Verify screenshot contains rendered game content
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/real_game_screenshot_content_qa.py artifacts/honour-war-real-game.png


      - name: Upload real gameplay screenshot
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-real-game-screenshot
          path: |
            artifacts/honour-war-real-game.png
            real-game-screenshot.log
            screenshot-scene-validation.log
          if-no-files-found: error
