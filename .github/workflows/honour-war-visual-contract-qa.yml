name: Honour War visual contract QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: honour-war-visual-contract-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  visual-contract:
    name: Production asset and presentation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"
      - name: Validate production visual contract
        run: python3 tools/honour_war_visual_qa.py
