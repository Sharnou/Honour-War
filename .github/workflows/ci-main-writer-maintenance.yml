name: Honour War CI main-writer maintenance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ci-main-writer-maintenance.yml'

permissions:
  contents: write

concurrency:
  group: honour-war-main-writer
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Normalize GitHub Actions writer workflows
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          shared_group = 'honour-war-main-writer'
          changed = []

          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              if path.name == 'ci-main-writer-maintenance.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              # Remove recurring GitHub Actions Node 20 warnings from active workflows.
              text = text.replace('actions/checkout@v4', 'actions/checkout@v7')
              text = text.replace('actions/upload-artifact@v4', 'actions/upload-artifact@v7')

              is_writer = 'contents: write' in text and 'git push' in text
              if is_writer:
                  # Every workflow that can mutate main must enter the same writer lane.
                  concurrency_match = re.search(r'(?ms)^concurrency:\n(?P<body>(?:^[ \t]+.*\n?)*)', text)
                  if concurrency_match:
                      body = concurrency_match.group('body')
                      if re.search(r'(?m)^  group:\s*.*$', body):
                          body = re.sub(r'(?m)^  group:\s*.*$', f'  group: {shared_group}', body, count=1)
                      else:
                          body = f'  group: {shared_group}\n' + body
                      body = re.sub(r'(?m)^  cancel-in-progress:\s*.*$', '  cancel-in-progress: false', body, count=1)
                      if '  cancel-in-progress:' not in body:
                          body = body.rstrip('\n') + '\n  cancel-in-progress: false\n'
                      text = text[:concurrency_match.start('body')] + body + text[concurrency_match.end('body'):]
                  else:
                      insert_at = re.search(r'(?m)^(?:env:|jobs:)', text)
                      block = f'concurrency:\n  group: {shared_group}\n  cancel-in-progress: false\n\n'
                      if insert_at:
                          text = text[:insert_at.start()] + block + text[insert_at.start():]
                      else:
                          text = text + '\n' + block

                  # Writer jobs should build the current main after waiting for the writer lane,
                  # not an older triggering SHA that may have been superseded while queued.
                  text = text.replace('          ref: ${{ github.sha }}\n', '')

                  # Protect against an out-of-band manual push even though writer workflows are serialized.
                  text = text.replace('git push origin HEAD:main', 'git fetch origin main\ngit rebase origin/main\ngit push origin HEAD:main')

              # Make the known mouse/camera repair workflow idempotent. A block may already
              # contain the desired state because another repair workflow applied it first.
              if path.name == 'fix-mouse-camera-and-graphics.yml':
                  replacements = [
                      (
                          "if old_pick not in text:\n              raise SystemExit('Mouse warp-gate block not found')\n          text=text.replace(old_pick,new_pick)",
                          "if old_pick in text:\n              text=text.replace(old_pick,new_pick)\n          elif new_pick not in text:\n              raise SystemExit('Mouse warp-gate block not found in either expected state')",
                      ),
                      (
                          "if old_move not in text:\n              raise SystemExit('Mouse movement block not found')\n          text=text.replace(old_move,new_move)",
                          "if old_move in text:\n              text=text.replace(old_move,new_move)\n          elif new_move not in text:\n              raise SystemExit('Mouse movement block not found in either expected state')",
                      ),
                      (
                          "if old_click not in text:\n              raise SystemExit('Mouse ground-click block not found')\n          text=text.replace(old_click,new_click)",
                          "if old_click in text:\n              text=text.replace(old_click,new_click)\n          elif new_click not in text:\n              raise SystemExit('Mouse ground-click block not found in either expected state')",
                      ),
                      (
                          "if old_walk not in text:\n              raise SystemExit('Combat walk animation block not found')\n          text=text.replace(old_walk,new_walk)",
                          "if old_walk in text:\n              text=text.replace(old_walk,new_walk)\n          elif new_walk not in text:\n              raise SystemExit('Combat walk animation block not found in either expected state')",
                      ),
                      (
                          "if old_end not in text:\n              raise SystemExit('Combat process tail not found')\n          text=text.replace(old_end,new_end,1)",
                          "if old_end in text:\n              text=text.replace(old_end,new_end,1)\n          elif new_end not in text:\n              raise SystemExit('Combat process tail not found in either expected state')",
                      ),
                      (
                          "if marker not in text:\n              raise SystemExit('Combat state marker not found')\n          text=text.replace(marker,camera_fn+marker,1)",
                          "if marker in text:\n              text=text.replace(marker,camera_fn+marker,1)\n          elif 'func _stabilize_camera()->void:' not in text:\n              raise SystemExit('Combat state marker not found in either expected state')",
                      ),
                      (
                          "if marker not in text:\n              raise SystemExit('Monster detail insertion marker not found')\n          text=text.replace(marker,detail_fn+marker,1)",
                          "if marker in text:\n              text=text.replace(marker,detail_fn+marker,1)\n          elif 'func _add_monster_details(visual:Node3D,name:String,boss:bool)->void:' not in text:\n              raise SystemExit('Monster detail insertion marker not found in either expected state')",
                      ),
                      (
                          "if old not in text:\n              raise SystemExit('Monster detail call site not found')\n          text=text.replace(old,new,1)",
                          "if old in text:\n              text=text.replace(old,new,1)\n          elif '_add_monster_details(visual,str(monster.get(\\\"name\\\",\\\"Monster\\\")),bool(monster.get(\\\"mvp\\\",false)))' not in text:\n              raise SystemExit('Monster detail call site not found in either expected state')",
                      ),
                      (
                          "if old not in text:\n              raise SystemExit('Game3D camera block not found')\n          text=text.replace(old,new,1)",
                          "if old in text:\n              text=text.replace(old,new,1)\n          elif new not in text:\n              raise SystemExit('Game3D camera block not found in either expected state')",
                      ),
                  ]
                  for old, new in replacements:
                      text = text.replace(old, new)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          if changed:
              print('Normalized workflows:')
              for item in changed:
                  print(' -', item)
          else:
              print('All GitHub Actions workflows are already normalized.')

      - name: Verify writer workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.github/workflows')
          for path in sorted(list(root.glob('*.yml')) + list(root.glob('*.yaml'))):
              text=path.read_text(encoding='utf-8')
              if 'contents: write' in text and 'git push' in text:
                  if 'group: honour-war-main-writer' not in text:
                      raise SystemExit(f'Writer workflow is outside shared writer lane: {path}')
                  if 'cancel-in-progress: false' not in text:
                      raise SystemExit(f'Writer workflow must not cancel queued writers: {path}')
          print('Main-writer workflow contract: PASS')
          PY

      - name: Commit normalized workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No workflow normalization changes required."
            exit 0
          fi
          git commit -m "Serialize main-writing workflows and harden CI repairs"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
