name: Honour War Top-100 Database QA

on:
  push:
    branches: [main]
    paths:
      - 'data/top_100_items_cards.csv'
      - 'scripts/Top100Database.gd'
      - 'scripts/LootProgressionSystem.gd'
      - 'tools/top100_database_qa.py'
      - '.github/workflows/honour-war-top100-database-qa.yml'
  pull_request:
    branches: [main]
    paths:
      - 'data/top_100_items_cards.csv'
      - 'scripts/Top100Database.gd'
      - 'scripts/LootProgressionSystem.gd'
      - 'tools/top100_database_qa.py'
      - '.github/workflows/honour-war-top100-database-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# Top-100 validation is commit-specific. Keep queued/in-flight validations alive
# so a newer main commit cannot cancel the validation of the change that started it.
concurrency:
  group: honour-war-top100-database-qa-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  validate-top100:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"

      - name: Validate canonical Top-100 database
        run: python tools/top100_database_qa.py
