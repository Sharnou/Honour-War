name: Honour War HD Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-hd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-contract:
    name: HD art pipeline contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate production art structure
        run: python3 tools/validate_hd_assets.py
      - name: Check forbidden prototype VFX alpha tween pattern
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInF 'modulate:a' scripts --include='*.gd'; then
            echo 'ERROR: forbidden modulate:a pattern detected in GDScript.'
            exit 1
          fi
          echo 'PASS: no forbidden modulate:a pattern found in scripts.'
      - name: Check production pipeline declaration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'Blender -> Substance 3D Painter -> GLB/GLTF -> Godot 4' ART_PIPELINE.md
          grep -F 'Blender → Substance 3D Painter → GLB/GLTF → Godot 4' docs/HD_ART_DIRECTION.md

  godot-editor:
    name: Godot 4.2.2 renderer-safe validation
    runs-on: ubuntu-latest
    needs: art-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux rendering/runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools
          echo '=== Vulkan ICD inventory ==='
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print | sort || true
          echo '=== Vulkan summary ==='
          vulkaninfo --summary || true
      - name: Download Godot 4.2.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.2.2-stable_linux.x86_64
      - name: Validate project in renderer-independent OpenGL compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.2.2-stable_linux.x86_64 --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | tee godot-editor.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene' godot-editor.log; then
            echo 'ERROR: Godot reported script/scene loading errors.'
            exit 1
          fi
      - name: Forward+ startup smoke test with available Vulkan ICD
        shell: bash
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*.json' | head -n 1 || true)
          if [ -z "${icd}" ]; then
            echo 'WARNING: No Vulkan ICD JSON was discovered; skipping Forward+ smoke test.'
            exit 0
          fi
          echo "Using Vulkan ICD: ${icd}"
          set +e
          xvfb-run -a env VK_ICD_FILENAMES="${icd}" ./Godot_v4.2.2-stable_linux.x86_64 --headless --editor --path . --rendering-method forward_plus --rendering-driver vulkan --quit 2>&1 | tee godot-forward-plus.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then
            echo 'WARNING: Forward+ Vulkan smoke test could not start on this CI runner.'
          else
            echo 'PASS: Forward+ Vulkan editor startup completed.'
          fi
      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-renderer-validation-logs
          path: |
            godot-editor.log
            godot-forward-plus.log
          if-no-files-found: ignore
      - name: Validate final renderer contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'renderer/rendering_method.mobile="mobile"' project.godot
          grep -F 'run/main_scene="res://Main3D.tscn"' project.godot

  production-assets:
    name: Production GLB/GLTF inventory
    runs-on: ubuntu-latest
    needs: art-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inventory production assets
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Honour War production asset inventory ==='
          find assets/3d -type f \( -name '*.glb' -o -name '*.gltf' \) -print | sort || true
          echo '=== Blender source inventory ==='
          find assets -type f -name '*.blend' -print | sort || true
          echo '=== Texture inventory ==='
          find assets/3d -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.tga' -o -name '*.webp' \) -print | sort || true
      - name: Report current production asset count
        shell: bash
        run: |
          set -euo pipefail
          models=$(find assets/3d -type f \( -name '*.glb' -o -name '*.gltf' \) | wc -l)
          textures=$(find assets/3d -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.tga' -o -name '*.webp' \) | wc -l)
          echo "Production models: ${models}"
          echo "Production textures: ${textures}"
          echo "The manifest remains valid while the production asset library is being authored."
