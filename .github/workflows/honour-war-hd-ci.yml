name: Honour War HD Production CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest validation for a branch should consume the runner. This
# prevents stale fast-auth/production runs from remaining in progress after a
# corrective commit has already superseded them.
concurrency:
  group: honour-war-hd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  art-contract:
    name: HD art pipeline contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"
      - name: Validate production art structure
        run: python3 tools/validate_hd_assets.py
      - name: Validate SS autonomous AI contract
        run: python3 tools/ss_ai_qa.py
      - name: Validate SS rental contract
        run: python3 tools/ss_rental_qa.py
      - name: Validate Game3D and 3D interaction hitbox contract
        run: python3 tools/game3d_integrity_qa.py
      - name: Check forbidden prototype VFX alpha tween pattern
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInF 'modulate:a' scripts --include='*.gd'; then
            echo 'ERROR: forbidden modulate:a pattern detected in GDScript.'
            exit 1
          fi
      - name: Check production pipeline declaration
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FBX/OBJ' ART_PIPELINE.md
          grep -F 'Neural4D' ART_PIPELINE.md
          grep -F 'native Godot 4.7.2' ART_PIPELINE.md
          grep -F 'Neural4D' docs/HD_ART_DIRECTION.md
          grep -F 'native Godot 4.7.2' docs/HD_ART_DIRECTION.md

  godot-editor:
    name: Godot 4.7.2 renderer-safe validation
    runs-on: ubuntu-latest
    needs: art-contract
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"
      - name: Install Linux rendering/runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools
          find /usr/share/vulkan/icd.d -maxdepth 1 -type f -print | sort || true
      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Validate project in OpenGL compatibility mode
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --rendering-method gl_compatibility --rendering-driver opengl3 --quit 2>&1 | tee godot-editor.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR: Failed to load script|ERROR: Cannot load scene' godot-editor.log; then exit 1; fi
      - name: Validate fast username/password registration
        shell: bash
        run: |
          set -euo pipefail
          echo "Running fast-auth regression in the foreground (timeout 120s)."
          timeout --kill-after=10s 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/fast_account_auth_test.gd 2>&1 | tee fast-account-auth.log
      - name: Validate four-point production completion
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/four_point_production_contract_test.gd 2>&1 | tee four-point-production.log
      - name: Forward+ startup smoke test
        shell: bash
        run: |
          set -euo pipefail
          icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*.json' | head -n 1 || true)
          if [ -z "${icd}" ]; then exit 0; fi
          set +e
          xvfb-run -a env VK_ICD_FILENAMES="${icd}" ./Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --rendering-method forward_plus --rendering-driver vulkan --quit 2>&1 | tee godot-forward-plus.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -ne 0 ]; then echo 'WARNING: Forward+ smoke test could not start on this runner.'; fi
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: godot-4-7-2-validation-logs
          path: |
            godot-editor.log
            fast-account-auth.log
            godot-forward-plus.log
            four-point-production.log
          if-no-files-found: ignore
      - name: Validate final renderer contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'config/features=PackedStringArray("4.7")' project.godot
          grep -F 'renderer/rendering_method="forward_plus"' project.godot
          grep -F 'renderer/rendering_method.mobile="mobile"' project.godot
          grep -F 'run/main_scene="res://Main3D.tscn"' project.godot

  production-assets:
    name: Native production asset inventory
    runs-on: ubuntu-latest
    needs: art-contract
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${GITHUB_SHA}"
          echo "Production inventory source verified."
          test "${actual}" = "${GITHUB_SHA}"
      - name: Reject retired generated GLB/GLTF assets
        shell: bash
        run: |
          set -euo pipefail
          if find assets/3d/generated -type f \( -name '*.glb' -o -name '*.gltf' \) -print -quit | grep -q .; then
            echo 'ERROR: retired generated GLB/GLTF asset found under assets/3d/generated'
            exit 1
          fi
      - name: Inventory approved native production assets
        shell: bash
        run: |
          set -euo pipefail
          find assets/3d -type f \( -name '*.fbx' -o -name '*.obj' -o -name '*.blend' \) -print | sort || true
          find assets/3d -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.tga' -o -name '*.webp' \) -print | sort || true
      - name: Report production asset count
        shell: bash
        run: |
          set -euo pipefail
          models=$(find assets/3d -type f \( -name '*.fbx' -o -name '*.obj' \) | wc -l)
          textures=$(find assets/3d -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' -o -name '*.tga' -o -name '*.webp' \) | wc -l)
          echo "Approved FBX/OBJ source models: ${models}"
          echo "Production textures: ${textures}"
