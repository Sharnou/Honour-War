name: Daily Honour War Upgrade

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/HWCharacterVisualProfiles.gd"
      - "scripts/ClassTreeSystem.gd"
      - "scripts/HWWorldActorVisualProfiles.gd"
      - "scripts/HWSSRentNPCDirector.gd"
      - "scripts/HWServiceNPCVisualDirector.gd"
      - "scripts/HWFinalVisualDirector.gd"
      - "scripts/CombatRuntime.gd"
      - "scripts/Main.gd"
      - "scripts/SkillSystem.gd"
      - "scripts/PetSystem.gd"
      - "scripts/MonsterDetailsSystem.gd"
      - "scripts/GameData.gd"
      - "scripts/FifthTierClassTreeSystem.gd"
      - "scripts/CompleteClassSkillTreeSystem.gd"
      - "tests/complete_class_skill_tree_contract_test.gd"
      - "tests/fifth_tier_profession_weapon_visual_contract_test.gd"
      - "tests/character_visual_profile_contract_test.gd"
      - "tests/hd_gameplay_presentation_contract_test.gd"
      - "tests/world_actor_visual_profile_contract_test.gd"
      - "tools/capture_real_game_screenshot.gd"
      - "tests/full_gameplay_runtime_qa.gd"
      - "tests/game_completion_contract_test.gd"
      - "tests/element_system_contract_test.gd"
      - "tools/honour_war_visual_qa.py"
      - "tools/validate_monster_visual_distinctness.py"
      - "docs/DAILY_HONOUR_WAR_NO_GLB_POLICY.md"
      - "scripts/HDAssetRuntime.gd"
      - "tools/validate_autoload_class_conflicts.py"
      - "scripts/HWProductionAudioDirector.gd"
      - "scripts/HWPerformanceDirector.gd"
      - "scripts/Game3D.gd"
      - "scripts/HWNativeWorldRecovery.gd"
      - "scripts/MovementStabilityFix.gd"
      - "scripts/HWGeneratedAssetRuntime.gd"
      - "scripts/HWRoleDrivenUpgradeRuntime.gd"
      - "tests/production_release_readiness_test.gd"
      - ".github/workflows/honour-war-production-release-readiness.yml"
      - ".github/workflows/honour-war-full-gameplay-qa.yml"
      - ".github/workflows/daily-honour-war-upgrade.yml"

concurrency:
  group: daily-honour-war-upgrade-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BINARY: "Godot_v4.7.2-stable_linux.x86_64"

jobs:
  daily-upgrade:
    name: Visual + Gameplay Daily Upgrade Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upgrade commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${GODOT_BINARY}.zip"
          unzip -q godot.zip
          chmod +x "${GODOT_BINARY}"

      - name: Validate autoload class conflicts before daily upgrade
        run: |
          python3 tools/validate_autoload_class_conflicts.py

      - name: Validate direct Screenshot visual source
        run: |
          python3 tools/validate_visual_reference_source.py

      - name: Enforce permanent HD GLB retirement
        run: |
          test -s docs/DAILY_HONOUR_WAR_NO_GLB_POLICY.md
          test -f scripts/HDAssetRuntime.gd
          grep -F "HD generated GLB assets were permanently retired" scripts/HDAssetRuntime.gd
          grep -F "Daily upgrades must NOT regenerate, download, import, or attach GLB assets." scripts/HDAssetRuntime.gd
          grep -F "native Godot runtime scene/visual systems" scripts/HDAssetRuntime.gd
          grep -F "Neural4D is an approved optional generation source" docs/DAILY_HONOUR_WAR_VISUAL_UPGRADE_ROLE.md
          grep -F "Neural4D GLB export is forbidden" docs/DAILY_HONOUR_WAR_VISUAL_UPGRADE_ROLE.md
          if find assets/3d/generated -type f -iname "*.glb" -print -quit | grep -q .; then
            echo "FAIL: retired HD GLB asset detected"
            exit 1
          fi
          echo "PASS: permanent HD GLB retirement enforced"
          if grep -RniE '(^|[^A-Za-z])meshy([^A-Za-z]|$)' scripts assets/3d --exclude-dir=visual_rag --exclude='*.md' --exclude='*.txt'; then
            echo "FAIL: Meshy production dependency/source detected"
            exit 1
          fi
          if grep -RniE 'res://[^[:space:]]+\\.(glb|gltf)([^A-Za-z]|$)|load\\([^)]*\\.(glb|gltf)' scripts; then
            echo "FAIL: retired GLB/GLTF runtime attachment detected"
            exit 1
          fi
          echo "PASS: Meshy and retired binary runtime attachment gates enforced"

      - name: Run Visual RAG before daily visual upgrade
        run: |
          python3 tools/visual_rag/honour_war_visual_rag.py
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.json
          test -s assets/3d/visual_rag/LATEST_VISUAL_BRIEF.md

      - name: Validate six-class clothing, emotion and progression visuals
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/character_visual_profile_contract_test.gd 2>&1 | tee character-visual-profile.log

      - name: Validate class-branch clothing style and emotion identity
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/character_visual_profile_contract_test.gd 2>&1 | tee branch-clothing-emotion.log
          grep -F "PASS: six-class clothing, emotion, motion, and progression visual profiles" branch-clothing-emotion.log

      - name: Validate monster pet MVP and NPC visual roles
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/world_actor_visual_profile_contract_test.gd 2>&1 | tee world-actor-visual-profile.log

      - name: Validate gameplay systems during the daily upgrade
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/hd_gameplay_presentation_contract_test.gd 2>&1 | tee gameplay-daily-upgrade.log

      - name: Run full gameplay runtime regression
        run: |
          ./"${GODOT_BINARY}" --headless --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tests/full_gameplay_runtime_qa.gd 2>&1 | tee full-gameplay-runtime-qa.log
          grep -F "FULL_GAMEPLAY_QA: PASS" full-gameplay-runtime-qa.log

      - name: Run game completion regression
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/game_completion_contract_test.gd 2>&1 | tee game-completion-contract.log

      - name: Run ten-element system regression
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/element_system_contract_test.gd 2>&1 | tee element-system-qa.log
          grep -F "ELEMENT_SYSTEM_QA: PASS" element-system-qa.log

      - name: Run visual asset and monster uniqueness regression
        run: |
          python3 tools/honour_war_visual_qa.py 2>&1 | tee visual-qa.log
          python3 tools/validate_monster_visual_distinctness.py 2>&1 | tee monster-distinctness.log

      - name: Verify release workflow contains Windows EXE QA gate
        run: |
          grep -F "Run deterministic gameplay smoke test in exported EXE" .github/workflows/honour-war-full-gameplay-qa.yml
          grep -F "Launch and test exported EXE runtime" .github/workflows/honour-war-full-gameplay-qa.yml

      - name: Capture real running-game screenshot
        run: |
          sudo apt-get install -y xvfb
          timeout 35s xvfb-run -a ./"${GODOT_BINARY}" --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tools/capture_real_game_screenshot.gd 2>&1 | tee real-game-screenshot.log
          test -s visual-captures/honour-war-real-game.png

      - name: Validate Fifth Tier profession-rooted skills, weapons and visuals
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/fifth_tier_profession_weapon_visual_contract_test.gd 2>&1 | tee fifth-tier-profession-skill.log
          grep -F "PASS: all six Fifth Tier professions are weapon-, material-, silhouette- and VFX-rooted" fifth-tier-profession-skill.log

      - name: Validate complete Tier 1 to Tier 5 skill trees for all six classes
        run: |
          ./"${GODOT_BINARY}" --headless --path . --script res://tests/complete_class_skill_tree_contract_test.gd 2>&1 | tee complete-class-skill-tree.log
          grep -F "COMPLETE_CLASS_SKILL_TREE_QA: PASS" complete-class-skill-tree.log

      - name: Validate combat, skills, pets and progression source wiring
        run: |
          grep -F 'ClassTreeSystem.branch_bonus' scripts/CombatRuntime.gd
          grep -F 'func use_skill' scripts/Main.gd
          grep -F 'max_level' scripts/PetSystem.gd
          grep -F 'fifth_job_class' scripts/GameData.gd


      - name: Run production release readiness regression
        run: |
          ./"${GODOT_BINARY}" --headless --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tests/production_release_readiness_test.gd 2>&1 | tee production-release-readiness.log
          grep -F "PRODUCTION_RELEASE_READINESS: PASS" production-release-readiness.log

      - name: Upload daily upgrade QA logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-honour-war-upgrade-logs
          path: |
            character-visual-profile.log
            branch-clothing-emotion.log
            gameplay-daily-upgrade.log
            full-gameplay-runtime-qa.log
            game-completion-contract.log
            element-system-qa.log
            visual-qa.log
            monster-distinctness.log
            world-actor-visual-profile.log
            real-game-screenshot.log
            production-release-readiness.log
            fifth-tier-profession-skill.log
            complete-class-skill-tree.log
            visual-captures/honour-war-real-game.png
          if-no-files-found: ignore
