name: Honour War Neural4D Asset Intake QA

on:
  workflow_dispatch:
    inputs:
      generation_run_id:
        description: "GitHub Actions run ID that produced the Neural4D artifact"
        required: true
        type: string
      artifact_name:
        description: "Generation artifact name"
        required: true
        default: "honour-war-neural4d-hd-assets-0-6"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  intake:
    name: Validate generated FBX/OBJ intake
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download generated asset artifact
        uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.generation_run_id }}
          name: ${{ inputs.artifact_name }}
          path: assets/3d/neural4d/incoming
          github-token: ${{ github.token }}

      - name: Strict Neural4D intake gate
        run: |
          python3 tools/validate_neural4d_assets.py             assets/3d/neural4d/incoming             --report reports/neural4d-intake.json

      - name: Reject GLB/GLTF anywhere in generated intake
        run: |
          if find assets/3d/neural4d/incoming -type f \(             -iname '*.glb' -o -iname '*.gltf' \) | grep -q .; then
            echo "FAIL: GLB/GLTF detected"
            exit 1
          fi

      - name: Upload intake report
        uses: actions/upload-artifact@v7
        with:
          name: honour-war-neural4d-intake-report
          path: reports/neural4d-intake.json
          if-no-files-found: error
