name: Honour War — Daily 3D Asset Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  build-3d-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate production GLB assets
        shell: bash
        run: |
          blender --background --python tools/blender/honour_war_production_assets.py

      - name: Report generated assets
        shell: bash
        run: |
          echo "Generated GLB/GLTF assets:"
          find assets/3d/generated -type f \( -name '*.glb' -o -name '*.gltf' \) | sort | tee /tmp/generated-assets.txt
          echo "Asset count: $(wc -l < /tmp/generated-assets.txt)"
          echo "Total asset size: $(du -sh assets/3d/generated | cut -f1)"

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/3d/generated
          if git diff --cached --quiet; then
            echo "No generated asset changes to commit."
            exit 0
          fi
          git commit -m "Generate Honour War production 3D assets"
          git push origin HEAD:main
