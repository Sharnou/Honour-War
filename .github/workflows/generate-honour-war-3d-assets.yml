name: Honour War — Legacy 3D Asset Compatibility QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honour-war-3d-compat-qa-${{ github.ref }}
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate-existing-3d-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout validation commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Report validation source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${GITHUB_SHA}"
          echo "Validation HEAD: ${actual}"
          echo "Workflow SHA:    ${expected}"
          test "${actual}" = "${expected}"

      - name: Validate canonical production GLB inventory and PBR contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_generated_glbs.py
          echo "Legacy compatibility QA is read-only; generation belongs exclusively to Honour War Final GLB Asset Build."
