name: Honour War Unreal Engine Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: honour-war-unreal-engine-validation.yml
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate permanent Honour War exclusions
        run: python tools/rejected_systems_qa.py

      - name: Validate complete content catalog
        run: python tools/content_catalog_qa.py

      - name: Validate canonical game rules
        run: python tools/game_rules_qa.py

      - name: Validate seven-class job architecture
        run: python tools/class_job_qa.py

      - name: Validate item/card encyclopedia and help
        run: python tools/item_help_qa.py

      - name: Run full-game readiness contract
        run: python tools/full_game_test_contract_qa.py

      - name: Validate Unreal 5.8 + HD MMORPG contract
        run: python tools/unreal_engine_contract_qa.py

      - name: Validate locked MMORPG camera, sky and fog
        run: python tools/validate_camera_controls.py

      - name: Validate original audio pack
        run: python tools/audio_asset_qa.py

      - name: Validate core progression, rewards, economy and autosave
        run: python tools/honour_war_progression_contract_qa.py

      - name: Validate quest and world-event content
        run: python tools/quest_event_qa.py

      - name: Validate Visual RAG cycle contract
        run: python tools/visual_gap_register_qa.py

      - name: Validate HD asset generators and intake
        run: |
          python tools/validate_hd_assets.py
          python tools/validate_art_generators.py
